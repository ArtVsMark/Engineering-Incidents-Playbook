# Действие, которое каталог публикует для своих потребителей.
#
# Подключается одним рабочим процессом на стороне проекта; своего скрипта в
# проекте не заводится. Причина в разнице стеков: копия генератора в каждом
# репозитории — это N реализаций одного алгоритма, и первая же правка разведёт
# их (правила 090 и 022). Здесь реализация одна, и она у автора.
#
# Каталог НЕ рассылает ничего сам: рассылка потребовала бы токена с правом
# писать во все проекты, включая приватный, то есть одной точки отказа и
# широких прав ради уведомления. Тянет потребитель — своим токеном и в свой
# трекер.
name: Правила каталога — входящие
description: >-
  Сверяет правила каталога с ответом проекта и ведёт одну задачу-«входящие»
  со списком нерассмотренных. Идемпотентно: обновляет ту же задачу, а не
  плодит новые.

inputs:
  catalogue:
    description: "Репозиторий каталога, откуда берётся экспорт правил"
    required: false
    default: ArtVsMark/Engineering-Incidents-Playbook
  ref:
    description: "Ветка или тег каталога"
    required: false
    default: main
  bindings:
    description: "Путь к ответу проекта внутри его репозитория"
    required: false
    default: .rules/bindings.json
  title:
    description: "Заголовок задачи-«входящих»"
    required: false
    default: "Правила каталога: входящие"
  token:
    description: >-
      Токен с правом писать задачи в этом репозитории. Обычного GITHUB_TOKEN
      достаточно: задача заводится от имени проекта, личность человека она не
      несёт (правила 131, 135).
    required: true

runs:
  using: composite
  steps:
    # Экспорт каталога тянется обычным HTTPS, поэтому клонировать его незачем;
    # нужен только сам скрипт, который лежит рядом с этим файлом.
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.catalogue }}
        ref: ${{ inputs.ref }}
        path: .rules-sync
        fetch-depth: 1

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: сверить правила каталога с ответом проекта
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -uo pipefail
        # Площадка зовёт композитный шаг как `bash -eo pipefail {0}`, и
        # `set -uo pipefail` этот `-e` НЕ снимает. Без `|| rc=$?` оболочка
        # умирает на ненулевом коде раньше, чем `rc` присвоится: разбор кода
        # стоит за строкой, до которой управление не доходит, и «очередь»
        # роняет прогон потребителя наравне с поломкой (задача #82).
        rc=0
        python .rules-sync/scripts/sync_inbox.py \
          --catalogue "${{ inputs.catalogue }}" \
          --ref "${{ inputs.ref }}" \
          --bindings "${{ inputs.bindings }}" \
          --title "${{ inputs.title }}" || rc=$?
        # Нерассмотренные правила — очередь, а не поломка сборки потребителя.
        # Красным здесь имеет смысл быть только третьему исходу: механизм не
        # отработал и об этом надо знать (правило 039).
        if [ "$rc" -eq 2 ]; then exit 1; fi
        exit 0
