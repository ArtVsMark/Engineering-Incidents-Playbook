# Обвязка тестов. До неё каталог был проверяем только гейтами по живым данным:
# они ловят порчу СОДЕРЖИМОГО (правило только на одном языке, ссылка в никуда),
# но про сами скрипты не говорят ничего. Скрипт, который никто не вызывал с
# краевым входом, ничего не гарантирует — ровно то, о чём заголовок ci.yml.
#
# ПОЧЕМУ ПОКРЫТИЕ МЕРЯЕТСЯ ТЕСТАМИ, А НЕ ПРОГОНОМ ГЕЙТОВ. Замерить, сколько
# строк исполняется, пока CI гоняет свои семь проверок, технически можно, и
# число вышло бы куда красивее. Но это «сколько кода трогает штатный прогон», а
# не покрытие тестами, и подпись `coverage` над ним читалась бы как обещание,
# которого никто не давал (правило 049).
# Зависимости тестов живут в requirements-test.txt, а не здесь: их ставят две
# работы конвейера, и им нужен файл, а не поле, которое надо уметь прочитать.
# Одно место на оба потребителя (правило 022).
[project]
name = "engineering-incidents-playbook"
version = "0.0.0"
description = "Каталог правил: обвязка тестов. Пакетом не публикуется."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Скрипты лежат в scripts/ и пакетом не оформлены: путь добавляет conftest.py.
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["scripts"]
branch = true

[tool.coverage.report]
# `if __name__ == "__main__"` тестами не исполняется никогда и покрытием быть
# не может: считать его непокрытым значит занижать число на ровном месте.
exclude_lines = ['if __name__ == .__main__.:']
show_missing = true
