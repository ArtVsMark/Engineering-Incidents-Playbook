# Атрибуция в ИТОГОВОЙ истории общей ветки. Правило 123 требует проверять её
# там, а не в коммитах ветки: гейт на изменении зелёный, а в первопредках `main`
# трейлеров может не быть вовсе (задача #34).
#
# ПОЧЕМУ ОТДЕЛЬНЫМ ФАЙЛОМ, А НЕ РАБОТОЙ В `ci.yml`. Работа с условием `if` даёт
# на изменениях проверку с исходом `skipped`. Площадка считает такое изменение
# НЕ чистым, и включить ему автомерж нельзя: `enablePullRequestAutoMerge`
# отказывает. То есть одна пропущенная работа тихо ломала бы весь автомерж.
# Отдельный файл со своим событием не создаёт проверки на изменениях вовсе.
#
# Красное здесь означает долг, который правкой изменения не чинится, — в
# отличие от `ci.yml`, который отвечает на «можно ли это слить».
name: attribution-history

on:
  push:
    branches: [main]
  # У события всегда есть ручная кнопка (правило 104).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-parents:
    runs-on: ubuntu-latest
    steps:
      # Первопредки — это вся история общей ветки, мелкого клона мало.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: атрибуция доехала до первопредков main
        run: python scripts/check_attribution.py --first-parents --ref HEAD
