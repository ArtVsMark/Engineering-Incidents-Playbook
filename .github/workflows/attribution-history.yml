# Атрибуция в ИТОГОВОЙ истории общей ветки. Правило 123 требует проверять её
# там, а не в коммитах ветки: гейт на изменении зелёный, а в первопредках `main`
# трейлеров может не быть вовсе (задача #34).
#
# ПОЧЕМУ ОТДЕЛЬНЫМ ФАЙЛОМ, А НЕ РАБОТОЙ В `ci.yml`. Работа с условием `if` даёт
# на изменениях проверку с исходом `skipped`. Площадка считает такое изменение
# НЕ чистым, и включить ему автомерж нельзя: `enablePullRequestAutoMerge`
# отказывает. То есть одна пропущенная работа тихо ломала бы весь автомерж.
# Отдельный файл со своим событием не создаёт проверки на изменениях вовсе.
#
# Красное здесь означает долг, который правкой изменения не чинится, — в
# отличие от `ci.yml`, который отвечает на «можно ли это слить».
#
# ПОЧЕМУ `--since`. Без него проверка спрашивала со ВСЕЙ истории и краснела
# всегда: 97 первопредков составлены площадкой до того, как автомерж научился
# переносить трейлеры, и переписать их нечем. Вечное красное — не сигнал, а фон
# (правило 051), и четыре дня рядом с ним никто не заметил другого, настоящего
# отказа (правило 142).
#
# Долг не спрятан, а ОБЪЯВЛЕН: миграция идёт от текущей версии, а не от нуля
# (правило 114).
#
# ГРАНИЦА ДВИНУТА ВТОРОЙ РАЗ — 3 сентября, с ac46aedf на 861737c, и вот чем это
# оплачено. Первый удавшийся выпуск завёл коммит 861737c без единого трейлера:
# `release.yml` составлял сообщение одной строкой. Гейт покраснел в тот же час
# и назвал предмет верно — коммит в общей ветке, защищённой, и переписать его
# нечем.
#
# ПОЧЕМУ ЭТО НЕ ЗАМАЛЧИВАНИЕ. Между границей и этой правкой стоит починка
# ПРИЧИНЫ: коммит выпуска теперь несёт `Co-Authored-By` и `Claude-Session`, как
# коммит `consumers-sync`. Двигать границу без неё значило бы получить тот же
# отказ на следующем выпуске и двинуть её снова — это и есть фон вместо сигнала
# (051). Сдвиг без починки причины запрещён здесь прямым текстом.
#
# ЧТО ПОТЕРЯНО: 208 первопредков до 861737c больше не спрашиваются. Потери нет
# — они неизменяемы, и все были зелёными; гейт заведён против НОВЫХ коммитов
# без трейлеров, а их он спрашивает по-прежнему все.
name: attribution-history

on:
  push:
    branches: [main]
  # У события всегда есть ручная кнопка (правило 104).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-parents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Первопредки — это вся история общей ветки, мелкого клона мало.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: атрибуция доехала до первопредков main
        run: >-
          python scripts/check_attribution.py --first-parents --ref HEAD
          --since 861737c
