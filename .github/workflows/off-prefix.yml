# У ОТМЕНЫ ЕСТЬ АДРЕСАТ (правило 147).
#
# Ветка мимо префикса `agent/` не открывает изменение: `agent-pr.yml` её не
# видит, потому что не запускается вовсе. Отмена операции при этом происходит
# МОЛЧА — «не совпало» и «совпало, но делать нечего» дают один и тот же
# наблюдаемый результат: тишину.
#
# Цена измерена: готовое правило пролежало сутки на ветке мимо префикса, и
# обнаружил его случайный взгляд. Прогона не было вовсе, а значит не было ни
# красного, ни лога, ни кода возврата — искать было негде.
#
# ЭТОТ ПРОГОН И ЕСТЬ АДРЕСАТ. Он ничего не чинит и не отказывает: ветка мимо
# префикса — штатное состояние (черновик, проба, чужой поток работы), и
# краснеть на ней значило бы приучать читать красное как фон (051). Он делает
# ровно одно: даёт отмене место, где её видно.
name: off-prefix

on:
  push:
    branches-ignore:
      - main
      - 'agent/**'
      - badges
  # Ручная кнопка (104, 126): у прогона, чьё событие не наступит, обязан быть
  # выход — иначе он замирает ровно тогда, когда нужен.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: off-prefix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: изменение по этой ветке не откроется
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "::warning title=Ветка мимо префикса::Ветка «$BRANCH» не начинается с agent/ — конвейер не откроет по ней изменение. Имя ветки здесь переключатель поведения (правило 003). Если работа готова, переименуйте ветку: git branch -m agent/$BRANCH && git push -u origin agent/$BRANCH"
          echo "Ветка: $BRANCH"
          echo "Что не произойдёт: agent-pr.yml не запустится, изменение не откроется,"
          echo "зона не проставится, пересечения с чужими изменениями не посчитаются."
          echo
          echo "Это не отказ: ветка мимо префикса — штатное состояние. Прогон существует"
          echo "ровно для того, чтобы отмена не была молчаливой (правило 147)."
