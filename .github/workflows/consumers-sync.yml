# Свежесть сводки «где действует». Отдельно от `ci.yml` намеренно: здесь есть
# сеть и чужой сервер, а обязательная проверка изменения зависеть от чужого
# сервера не должна — сетевой сбой покрасил бы чужую работу и остановил
# автомерж.
#
# Красное здесь означает одно из двух, и оба требуют человека: объявленный
# потребитель перестал отдавать ответ (правило 075) либо его ответ изменился, а
# сводка в репозитории осталась прежней (правило 049 — вычисляемое состояние
# протухло).
name: consumers-sync

on:
  schedule:
    # Не в 0 и не в 30: минута выбрана так, чтобы не совпадать с пиком, когда
    # площадка обслуживает все расписания планеты разом.
    - cron: "23 6 * * *"
  # У события всегда есть ручная кнопка (правило 104).
  workflow_dispatch:
  # Без ограничения по путям — намеренно. Красное расписания не гаснет от
  # починки: оно гаснет только СЛЕДУЮЩИМ прогоном, а следующий был через сутки.
  # Пока он не пришёл, вкладка показывает отказ, который уже починен, и отличить
  # его от живого нельзя (правило 142). Прогон дешёвый — опрос нескольких
  # публичных ответов, — а слияние в общую ветку это ровно тот момент, когда
  # состояние могло измениться.
  push:
    branches: [main]

permissions:
  contents: read
  # Красному нужен адресат. Прогон по расписанию не прикреплён ни к чьему
  # изменению и никого не блокирует: он краснеет на отдельной вкладке, куда
  # никто не ходит (правило 142). Право на запись в трекер — минимальное, и
  # оно здесь единственный способ довести находку до человека.
  issues: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Вывод сохраняется, а не только печатается: из него собирается тело
      # задачи. Иначе адресат получил бы ПЕРЕСКАЗ находки, написанный заранее
      # и потому не про неё — ровно то, что было: текст задачи говорил про
      # отставшую сводку, каким бы ни оказалось расхождение (правило 046).
      - name: опросить потребителей и пересобрать сводку
        run: |
          set -uo pipefail
          python scripts/aggregate_bindings.py 2>&1 | tee "$RUNNER_TEMP/aggregate.txt"
          exit "${PIPESTATUS[0]}"

      # СВЕЖИЕ ДАННЫЕ — НЕ НАХОДКА, А РАБОТА, КОТОРУЮ МОЖНО СДЕЛАТЬ.
      #
      # Здесь прогон краснел на том, что потребитель обновил свой ответ, и звал
      # человека выполнить команду, результат которой сам же только что
      # посчитал. Суждения между входом и выходом нет — значит, и человека тут
      # быть не должно. Красное на такой находке приучает читать красное как
      # фон (правило 051), и тогда оно не работает там, где оно настоящее.
      #
      # Настоящих находок у этого прогона три, и они остаются красными: ответ
      # не читается · потребитель отвечает о несуществующем правиле ·
      # объявленный молчит дольше срока. Все три чинит человек.
      #
      # Граница живёт в скрипте, а не здесь: сборщик, тронувший что-то кроме
      # объявленного набора производных, даёт исход 2, то есть красное, а не
      # тихий коммит. `|| rc=$?` нужен потому, что площадка зовёт `bash -e {0}`,
      # и `set -uo pipefail` его НЕ снимает (задача #98).
      - name: пересобрать производные
        id: refresh
        run: |
          set -uo pipefail
          rc=0
          python scripts/refresh_derived.py || rc=$?
          if [ "$rc" -ge 2 ]; then exit 1; fi
          echo "changed=$rc" >> "$GITHUB_OUTPUT"

      # ВЕТКА, А НЕ ЗАПИСЬ В ОБЩУЮ. Общая ветка защищена, и толчок в неё прошёл
      # бы мимо обязательных проверок. Ветка с префиксом `agent/` — переключатель
      # поведения (правило 003): по ней `agent-pr.yml` открывает изменение
      # ТОКЕНОМ ВЛАДЕЛЬЦА, дальше обычные проверки и автомерж.
      #
      # ТОЛКАЕТ ТОКЕН ВЛАДЕЛЬЦА, А НЕ GITHUB_TOKEN. Площадка намеренно не
      # запускает работы на толчок, сделанный GITHUB_TOKEN: с ним `agent-pr.yml`
      # не сработал бы, ветка молча копилась, а прогон был бы зелёным.
      #
      # ВЕТКА КАТИТСЯ, А НЕ НАКАПЛИВАЕТСЯ: каждый прогон пересобирает её от
      # головы общей ветки, поэтому толчок принудительный. Ветка машинная и
      # своей истории не несёт — переписывать здесь нечего.
      - name: свежие производные уезжают веткой
        if: steps.refresh.outputs.changed == '1'
        env:
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          BRANCH: agent/consumers-refresh
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # Токена нет — уехать нечем, и молчать об этом нельзя: сводка осталась
          # бы отставшей при зелёном прогоне. Здесь красное честное.
          if [ -z "$MERGE_QUEUE_TOKEN" ]; then
            echo "::error::Производные обновились, но MERGE_QUEUE_TOKEN не задан — веткой уехать нечем. Пересоберите руками: python scripts/refresh_derived.py"
            exit 1
          fi
          set -e
          # Автор — человек, агент — соавтор: ровно то, что свод требует от
          # любого коммита и что проверит `check_attribution.py` на изменении.
          git config user.name "Artem Markitanov"
          git config user.email "arvs.markitanov@gmail.com"
          git checkout -qB "$BRANCH"
          git add -- export/where.md export/where.json
          git --no-pager diff --cached --stat
          # Тело коммита становится телом изменения. Строка освобождения нужна
          # потому, что задачи у этой работы нет и быть не должно: она и есть
          # то, чем задача чинилась бы (`pr_body.py`).
          #
          # Текст лежит файлом, а не строкой внутри YAML: между текстом и
          # получателем встали бы две интерпретации подряд — YAML и оболочка
          # (правило 013). Переменная часть здесь одна — ссылка на прогон, и она
          # дописывается, а не подставляется.
          {
            cat .github/consumers-refresh-commit.md
            echo
            echo "Собрано прогоном: $RUN"
            echo
            echo "Co-Authored-By: Claude <noreply@anthropic.com>"
            echo "Claude-Session: $RUN"
          } > "$RUNNER_TEMP/msg.txt"
          git commit -q -F "$RUNNER_TEMP/msg.txt"
          # УЧЁТНЫЕ ДАННЫЕ В URL НЕ ПОБЕЖДАЮТ — ЗАМЕР, А НЕ ЧТЕНИЕ ДОКУМЕНТАЦИИ.
          # `actions/checkout` прописывает в локальный конфиг заголовок
          # `http.https://github.com/.extraheader` с токеном ПО УМОЛЧАНИЮ, и
          # он идёт с каждым запросом к github.com — включая толчок по адресу
          # с другими учётными данными. Заголовок перебивает URL.
          #
          # Первый живой запуск (прогон 82, 28 августа) сказал это прямо:
          #   remote: Permission to … denied to github-actions[bot].
          #   fatal: … The requested URL returned error: 403
          # Толчок ушёл от имени бота при полностью верном URL. Самопроверка
          # этого поймать не могла: она не ходит в сеть, а `--selftest` был
          # зелёным ровно потому, что проверял границу набора производных, а
          # не личность толкающего (правило 139 — механизм подтверждается
          # прогоном, и утверждение может быть ложным при исправном гейте).
          #
          # `permissions: contents: read` при этом ОСТАЁТСЯ. Поднять до write
          # значило бы разрешить толчок токеном по умолчанию — а такой толчок
          # площадка намеренно не считает событием, и `agent-pr.yml` по нему
          # не сработал бы. Изменение не открылось бы, а прогон позеленел.
          git config --local --unset-all http.https://github.com/.extraheader
          if ! git push -q --force \
               "https://x-access-token:$MERGE_QUEUE_TOKEN@github.com/$REPO" \
               "HEAD:refs/heads/$BRANCH"; then
            echo "::error::Толчок в $BRANCH отвергнут. Проверьте MERGE_QUEUE_TOKEN: нужны права contents:write и pull-requests:write у ВЛАДЕЛЬЦА. Толчок токеном по умолчанию здесь не годится — по нему не сработает agent-pr.yml."
            exit 1
          fi
          echo "производные уехали в $BRANCH — изменение откроет agent-pr.yml"

      # Обратное направление контракта (правило 080). Каталог опрашивает
      # предложения потребителей — правила, родившиеся у НИХ, — и ведёт ОДНУ
      # задачу-адресат, идемпотентно: та же задача обновляется, а не плодятся
      # копии. До этого 080 держалось шагом процесса, и цена измерена по
      # корпусу: из 143 записей 129 родились в грейдере и переносились руками.
      #
      # Шаг не роняет прогон: не разобранные предложения — очередь, а не
      # поломка (тот же выбор, что у задачи-«входящие» вниз по течению).
      # Исход 1 здесь означает «есть очередь», и `|| rc=$?` нужен потому, что
      # площадка зовёт `bash -e {0}`, а `set -uo pipefail` его НЕ снимает
      # (задача #98 — тот же дефект стоил четырёх дней).
      - name: предложения из проектов имеют адресата
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          python scripts/collect_proposals.py || rc=$?
          if [ "$rc" -ge 2 ]; then exit 1; fi
          exit 0

      # Правило 142: находка без адресата не находка. Задача заводится ОДНА —
      # пока она открыта, следующие прогоны молчат. Иначе ежедневный прогон
      # завалит трекер копиями, и это приучит читать красное как фон
      # (правило 051), то есть починит видимость ровно тем способом, который
      # её и ломает.
      #
      # Текст задачи лежит файлом, а не строкой внутри YAML: между текстом и
      # получателем стояли бы две интерпретации подряд — YAML и оболочка
      # (правило 013). Переменная часть здесь одна — ссылка на прогон, и она
      # дописывается, а не подставляется.
      # ЧУЖАЯ НАХОДКА КРАСНЫМ НЕ СТАНОВИТСЯ, но и без адресата не остаётся.
      # Снять её отсюда нечем: правится она в чужом репозитории. Красное,
      # которое нельзя погасить своей работой, приучают пропускать (051), а по
      # 053 оно ещё и останавливает всю остальную работу — цена измерена:
      # запись 143 в ответе витрины покрасила общую ветку каталога.
      # Поэтому у неё СВОЯ задача и свой заголовок, а не чужой текст про
      # отставшую сводку.
      - name: у чужой находки есть адресат
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Ответы потребителей разошлись с каталогом — правится у них"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if ! grep -q "находки в чужих репозиториях" "$RUNNER_TEMP/aggregate.txt" 2>/dev/null; then
            echo "чужих находок нет"
            exit 0
          fi
          # СПИСОК, А НЕ ПОИСК — по той же причине, что и ниже: поисковый
          # индекс площадки догоняет минутами и заводит вторую задачу.
          open=$(gh issue list --state open --limit 200 --json number,title \
                   --jq '[.[] | select(.title == env.TITLE)] | length')
          if [ "$open" != "0" ]; then
            echo "задача уже открыта — второй раз не завожу"
            exit 0
          fi
          {
            echo "Прогон \`consumers-sync\` нашёл расхождение в ответе потребителя."
            echo "**Прогон при этом зелёный, и это намеренно:** правится такое не здесь,"
            echo "а в чужом репозитории. Красное, которое нельзя снять своей работой,"
            echo "перестают читать — и тогда оно не работает и там, где оно наше."
            echo
            echo "Что делать: сказать потребителю. Тот же список приходит ему сам —"
            echo "разделом во входящих, которые ведёт действие каталога."
            echo
            echo '```'
            sed -n '/находки в чужих репозиториях/,/Адресаты/p' "$RUNNER_TEMP/aggregate.txt"
            echo '```'
            echo
            echo "Задача заводится **один раз**: пока открыта, прогоны молчат."
            echo "Закройте её, когда потребитель починит, — иначе следующее"
            echo "расхождение останется без адресата (правило 142)."
            echo
            echo "Прогон: $RUN"
          } > "$RUNNER_TEMP/foreign.md"
          gh issue create --title "$TITLE" --label "area/export" \
            --body-file "$RUNNER_TEMP/foreign.md"

      - name: у находки есть адресат
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Сводка «где действует» отстала от ответов потребителей"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # СПИСОК, А НЕ ПОИСК. `--search` ходит в поисковый индекс площадки,
          # а он догоняет с задержкой в минуты. Замер: два прогона с разницей
          # в три минуты оба не нашли только что заведённую задачу и завели по
          # своей — #133 и #134, при обещанной ОДНОЙ (правило 142). Обычный
          # список отдаёт актуальное состояние сразу, и отбор идёт здесь.
          open=$(gh issue list --state open --limit 200 --json number,title \
                   --jq '[.[] | select(.title == env.TITLE)] | length')
          if [ "$open" != "0" ]; then
            echo "задача уже открыта — второй раз не завожу"
            exit 0
          fi
          {
            cat .github/consumers-sync-issue.md
            echo
            echo "## Что сказал прогон"
            echo
            echo '```'
            # Находка называется СВОИМИ словами прогона, а не заготовкой:
            # заготовка описывает один случай, а красным прогон становится от
            # четырёх разных (отставшая сводка · нечитаемый ответ · лишний
            # ответ потребителя · объявленный и молчащий дольше срока).
            tail -40 "$RUNNER_TEMP/aggregate.txt" 2>/dev/null || echo "вывод прогона не сохранён"
            echo '```'
            echo
            echo "Прогон: $RUN"
          } > "$RUNNER_TEMP/body.md"
          gh issue create --title "$TITLE" --label "area/export" \
            --body-file "$RUNNER_TEMP/body.md"
