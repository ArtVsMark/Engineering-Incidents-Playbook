# Дежурный по общей ветке. Направление, которого не было: за записями следит
# автор правил, за скриптами инженер гейтов, за витриной редактор — а вопрос
# «зелена ли `main` ПРЯМО СЕЙЧАС» не задавал никто.
#
# ЦЕНА. Прогон `consumers-sync` краснел четыре дня подряд. Окно за это время
# открыло три изменения и ни разу не взглянуло на вкладку прогонов — при том,
# что читало 053 при старте. Заметил владелец. Знание правила не помогло,
# потому что у правила не было момента, в который его положено исполнить.
#
# ПОЧЕМУ ЗАДАЧА, А НЕ КРАСНОЕ. Трекер — первый источник работы по 091, и
# единственный, в который окно смотрит обязательно. Задача попадает туда, где
# её нельзя не увидеть; красное на вкладке — туда, куда не ходят (142).
#
# ПОЧЕМУ ОДНА. Ежедневная копия завалила бы трекер и приучила листать его мимо —
# то есть починила бы видимость способом, который её ломает (051).
name: main-red

on:
  schedule:
    # Через час после consumers-sync: если покраснел он, дежурный увидит уже
    # состоявшийся отказ, а не гонку с ним.
    - cron: "41 7 * * *"
  # У события всегда есть ручная кнопка (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # Дежурный спрашивает вкладку прогонов — это Actions API, и права на него
  # отдельные. Явный блок `permissions` обнуляет всё, что в нём не названо:
  # без этой строки первый же шаг получает 403, `set -euo pipefail` роняет
  # работу, и задача не заводится. Дежурный по красноте краснеет сам и молчит
  # об этом — ровно та слепота, ради которой он заведён (правило 142).
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "Общая ветка красная: работу не начинают, пока это не починено"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Спрашивается ПОСЛЕДНИЙ завершённый прогон каждой работы на main.
      # Незавершённые пропускаются: «ещё идёт» — не отказ, и краснеть на нём
      # значило бы заводить задачу на состояние, которое пройдёт само.
      #
      # attribution-history исключён осознанно и по имени: его красное означало
      # бы долг прошлой истории. Сейчас он зелёный, потому что долг объявлен
      # ключом --since; если объявление снимут, вернуть его сюда — отдельное
      # решение, а не молчаливое умолчание (правило 026).
      - name: какие работы красные на общей ветке
        run: |
          set -euo pipefail
          red=$(gh run list --branch main --limit 40 \
                  --json name,status,conclusion \
                  --jq '[.[] | select(.status=="completed")]
                        | group_by(.name) | map(.[0])
                        | map(select(.conclusion!="success"))
                        | map(select(.name!="attribution-history"))
                        | map(.name) | join(", ")')
          if [ -z "$red" ]; then
            echo "общая ветка зелёная: красных работ нет"
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            echo "красные работы: $red"
            echo "RED=$red" >> "$GITHUB_ENV"
          fi

      - name: задача уже открыта
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          # СПИСОК, А НЕ ПОИСК. `--search` ходит в поисковый индекс площадки,
          # а он догоняет с задержкой в минуты. Замер: два прогона с разницей
          # в три минуты оба не нашли только что заведённую задачу и завели по
          # своей — #133 и #134, при обещанной ОДНОЙ (правило 142). Обычный
          # список отдаёт актуальное состояние сразу, и отбор идёт здесь.
          open=$(gh issue list --state open --limit 200 --json number,title \
                   --jq '[.[] | select(.title == env.TITLE)] | length')
          if [ "$open" != "0" ]; then
            echo "задача уже открыта — второй раз не завожу"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      # Текст лежит файлом, а не строкой внутри YAML: иначе между ним и
      # площадкой встали бы две интерпретации подряд (правило 013).
      - name: у красноты есть адресат
        if: env.SKIP != '1'
        env:
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            cat .github/main-red-issue.md
            echo
            echo "Красные работы: $RED"
            echo
            echo "Прогон: $RUN"
          } > "$RUNNER_TEMP/body.md"
          gh issue create --title "$TITLE" --label "area/gates" \
            --body-file "$RUNNER_TEMP/body.md"
