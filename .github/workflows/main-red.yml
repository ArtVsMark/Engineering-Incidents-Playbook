# Дежурный по общей ветке. Направление, которого не было: за записями следит
# автор правил, за скриптами инженер гейтов, за витриной редактор — а вопрос
# «зелена ли `main` ПРЯМО СЕЙЧАС» не задавал никто.
#
# ЦЕНА. Прогон `consumers-sync` краснел четыре дня подряд. Окно за это время
# открыло три изменения и ни разу не взглянуло на вкладку прогонов — при том,
# что читало 053 при старте. Заметил владелец. Знание правила не помогло,
# потому что у правила не было момента, в который его положено исполнить.
#
# ПОЧЕМУ ЗАДАЧА, А НЕ КРАСНОЕ. Трекер — первый источник работы по 091, и
# единственный, в который окно смотрит обязательно. Задача попадает туда, где
# её нельзя не увидеть; красное на вкладке — туда, куда не ходят (142).
#
# ПОЧЕМУ ОДНА. Ежедневная копия завалила бы трекер и приучила листать его мимо —
# то есть починила бы видимость способом, который её ломает (051).
#
# ЛОГИКА ЖИВЁТ СКРИПТОМ, А НЕ ВЫРАЖЕНИЕМ В ШАГЕ. Дежурный нужен каждому
# потребителю с прогонами по расписанию, а не только каталогу (#139), и копия
# вбок разъедется с первой правки (090). Заодно шаг нельзя прогнать тем, что он
# обязан отвергнуть, а скрипт можно — и прогоняется (140, 145). Здесь остаётся
# то, что принадлежит ЭТОМУ проекту: заголовок, метка, список исключений.
name: main-red

on:
  schedule:
    # Через час после consumers-sync: если покраснел он, дежурный увидит уже
    # состоявшийся отказ, а не гонку с ним.
    - cron: "41 7 * * *"
  # У события всегда есть ручная кнопка (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # Дежурный спрашивает вкладку прогонов — это Actions API, и права на него
  # отдельные. Явный блок `permissions` обнуляет всё, что в нём не названо:
  # без этой строки первый же шаг получает 403, `set -euo pipefail` роняет
  # работу, и задача не заводится. Дежурный по красноте краснеет сам и молчит
  # об этом — ровно та слепота, ради которой он заведён (правило 142).
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # attribution-history исключён осознанно и по имени: его красное означало
      # бы долг прошлой истории. Сейчас он зелёный, потому что долг объявлен
      # ключом --since; если объявление снимут, вернуть его сюда — отдельное
      # решение, а не молчаливое умолчание (правило 026).
      - name: у красноты есть адресат
        env:
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # Площадка зовёт шаг как `bash -eo pipefail {0}`, и `set -uo pipefail`
          # этот `-e` НЕ снимает: без `|| rc=$?` оболочка умирает на ненулевом
          # коде раньше разбора. Именно на этом файле правило 145 и написано —
          # «объявлено два исхода, прогонов было ноль».
          # ИСКЛЮЧЕНИЙ БОЛЬШЕ НЕТ, и это замер, а не упрощение. Пока здесь
          # стояло `--exclude attribution-history`, дежурный не видел
          # красноты этой работы вовсе: 2 сентября она покраснела в 08:55,
          # плановый прогон отчитался «ветка зелёная», и в ветку уехали два
          # изменения. Причина исключения — долг прошлой истории — давно
          # выражена ключом `--since` у самого гейта, а не слепотой дежурного.
          rc=0
          python scripts/main_red.py \
            --branch main \
            --title "Общая ветка красная: работу не начинают, пока это не починено" \
            --label "area/gates" \
            --body-file .github/main-red-issue.md \
            --run-url "$RUN" \
            --apply || rc=$?
          # Красные работы — находка для человека, а не поломка дежурного.
          # Красным здесь имеет смысл быть только третьему исходу (039).
          if [ "$rc" -eq 2 ]; then exit 1; fi
          exit 0
