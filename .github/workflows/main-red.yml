# Дежурный по общей ветке. Направление, которого не было: за записями следит
# автор правил, за скриптами инженер гейтов, за витриной редактор — а вопрос
# «зелена ли `main` ПРЯМО СЕЙЧАС» не задавал никто.
#
# ЦЕНА. Прогон `consumers-sync` краснел четыре дня подряд. Окно за это время
# открыло три изменения и ни разу не взглянуло на вкладку прогонов — при том,
# что читало 053 при старте. Заметил владелец. Знание правила не помогло,
# потому что у правила не было момента, в который его положено исполнить.
#
# ПОЧЕМУ ЗАДАЧА, А НЕ КРАСНОЕ. Трекер — первый источник работы по 091, и
# единственный, в который окно смотрит обязательно. Задача попадает туда, где
# её нельзя не увидеть; красное на вкладке — туда, куда не ходят (142).
#
# ПОЧЕМУ ОДНА. Ежедневная копия завалила бы трекер и приучила листать его мимо —
# то есть починила бы видимость способом, который её ломает (051).
#
# ЛОГИКА ЖИВЁТ СКРИПТОМ, А НЕ ВЫРАЖЕНИЕМ В ШАГЕ. Дежурный нужен каждому
# потребителю с прогонами по расписанию, а не только каталогу (#139), и копия
# вбок разъедется с первой правки (090). Заодно шаг нельзя прогнать тем, что он
# обязан отвергнуть, а скрипт можно — и прогоняется (140, 145). Здесь остаётся
# то, что принадлежит ЭТОМУ проекту: заголовок, метка, список исключений.
name: main-red

on:
  schedule:
    # Через час после consumers-sync: если покраснел он, дежурный увидит уже
    # состоявшийся отказ, а не гонку с ним.
    #
    # УТВЕРЖДЕНИЕ ПРОВЕРЕНО МЕХАНИЗМОМ, А НЕ ОСТАВЛЕНО ПРОЗОЙ (183). Замер
    # 16.09 по всем прогонам с событием `schedule`, что отдаёт площадка: 21
    # сутки из 21 дежурный шёл ВТОРЫМ, зазор 36–83 минуты при длительности
    # прогона порядка 15 секунд. Порядок держится, хотя оба прогона площадка
    # сдвигает на часы: медиана опоздания 5,0 ч у этого и 5,1 ч у соседнего,
    # и сдвиг у них общий, потому порядок и не ломается.
    #
    # ГРАНИЦА: ЭТО СНИМОК, А НЕ ГАРАНТИЯ. Порядок держится на том, что сдвиг
    # общий; разойдись он — дежурный придёт первым и увидит гонку вместо
    # отказа, о чём прогон не скажет. Пересдать замер:
    #   gh run list --workflow main-red.yml --event schedule --json createdAt
    # и то же для consumers-sync.yml — сравнить время начала посуточно.
    #
    # ГЕЙТА НА РОСТ ОПОЗДАНИЯ ЗДЕСЬ НЕТ НАМЕРЕННО, и ответ разобран надвое,
    # как требует 182 (#491, находки обзора на #554).
    #
    # МАШИНЕ ДОСТУПНО БОЛЬШЕ, ЧЕМ ЗДЕСЬ СТОИТ, и это надо сказать прямо: снять
    # задержку прогонов у площадки и напечатать медиану — работа механическая
    # целиком, предмет есть (46 прогонов истории). Отвергается не ЗАМЕР, а
    # КРАСНОЕ по нему: опоздание есть поведение чужой стороны, снять его своей
    # работой нельзя, а красное, которое нельзя снять своей работой, приучают
    # обходить (051). Разница ровно та, что 051 и проводит: предупреждают о
    # вероятном, запрещают достоверное.
    #
    # ПРЕЖНЯЯ РЕДАКЦИЯ ССЫЛАЛАСЬ НА ВТОРОЙ ДОВОД, И ОН БЫЛ ЛОЖЕН. Стояло «такой
    # гейт обязан ходить на площадку, а прогон проверок наружу не ходит по
    # построению». Замер опровергает: scripts/aggregate_bindings.py зовёт
    # urlopen И стоит в обязательном прогоне, scripts/link_trails.py тоже.
    # Утверждение о механизме, проверяемое деревом, было проверено деревом и не
    # выдержало (183). Довод снят; остался один и настоящий — 051.
    #
    # ЧЕЛОВЕКУ ОСТАЁТСЯ ПОТОЛОК: с какой медианы задержка перестаёт быть
    # терпимой. Это суждение о том, насколько нам нужна свежесть, а не свойство
    # дерева, и машине его не дать.
    - cron: "41 7 * * *"
  # У события всегда есть ручная кнопка (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # Дежурный спрашивает вкладку прогонов — это Actions API, и права на него
  # отдельные. Явный блок `permissions` обнуляет всё, что в нём не названо:
  # без этой строки первый же шаг получает 403, `set -euo pipefail` роняет
  # работу, и задача не заводится. Дежурный по красноте краснеет сам и молчит
  # об этом — ровно та слепота, ради которой он заведён (правило 142).
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # attribution-history исключён осознанно и по имени: его красное означало
      # бы долг прошлой истории. Сейчас он зелёный, потому что долг объявлен
      # ключом --since; если объявление снимут, вернуть его сюда — отдельное
      # решение, а не молчаливое умолчание (правило 026).
      - name: у красноты есть адресат
        env:
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          # Площадка зовёт шаг как `bash -eo pipefail {0}`, и `set -uo pipefail`
          # этот `-e` НЕ снимает: без `|| rc=$?` оболочка умирает на ненулевом
          # коде раньше разбора. Именно на этом файле правило 145 и написано —
          # «объявлено два исхода, прогонов было ноль».
          # ИСКЛЮЧЕНИЙ ИЗ ПРОВЕРОК ВЕТКИ НЕТ, и это замер, а не упрощение. Пока
          # здесь стояло `--exclude attribution-history`, дежурный не видел
          # красноты этой работы вовсе: 2 сентября она покраснела в 08:55,
          # плановый прогон отчитался «ветка зелёная», и в ветку уехали два
          # изменения. Причина исключения — долг прошлой истории — давно
          # выражена ключом `--since` у самого гейта, а не слепотой дежурного.
          #
          # ИСКЛЮЧЕНЫ ДВЕ РАБОТЫ, И ОБЕ ДРУГОГО РОДА. Первая — `release`. Та работа ПРОВЕРЯЛА
          # ветку, и её красное значило «ветка сломана»; выпуск — ДЕЙСТВИЕ над
          # веткой, которое человек запускает кнопкой и видит исход сразу.
          # Свёртка берёт последний прогон работы, и упавший выпуск остаётся
          # последним до следующего выпуска: 27 сентября v1.3.0 упал трижды, и
          # эта задача сказала бы «работу не начинают» на недели при исправной
          # ветке. Очередь выпуск не морозит по той же причине (automerge.yml).
          #
          # Вторая — `python-next`: она спрашивает о СЛЕДУЮЩЕЙ версии Python, а не
          # проверяет ветку на текущей. Её красное значит «на 3.15 пока не
          # заработает», и остановка работы на 3.14 по нему была бы красным,
          # которое своей работой не снять (051). Ответ читают в её прогонах.
          rc=0
          python scripts/main_red.py \
            --branch main \
            --exclude release \
            --exclude python-next \
            --title "Общая ветка красная: работу не начинают, пока это не починено" \
            --label "area/gates" \
            --body-file .github/main-red-issue.md \
            --run-url "$RUN" \
            --apply || rc=$?
          # Красные работы — находка для человека, а не поломка дежурного.
          # Красным здесь имеет смысл быть только третьему исходу (039).
          if [ "$rc" -eq 2 ]; then exit 1; fi
          exit 0

  # ПРЕДРЕЛИЗНАЯ ВЕРСИЯ СВЕРЯЕТСЯ С ПЛОЩАДКОЙ (203). Пометка `allow-prereleases`
  # у прогона python-next устаревает от события в CPython, а не от правки здесь.
  # Адресат и находки, и отказа сверки — своя задача с маркером (142).
  #
  # РАБОТА НЕ КРАСНЕЕТ НИКОГДА (обзор #692). Она в прогоне дежурного, и её
  # красное он объявил бы красной ОБЩЕЙ ВЕТКОЙ — «работу не начинают» из-за
  # недоступного манифеста, чужого сбоя, который своей работой не снять (051).
  # Отказ сверки поэтому пишется в задачу, а не в цвет. Не дойдёт до задачи
  # только отказ самого трекера — и его видит работа watch: она читает тот же
  # трекер тем же токеном, и её красное здесь честное — сломан дежурный.
  python-next-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: предрелизная версия сверена с площадкой
        env:
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          rc=0
          python scripts/check_python_next.py --run-url "$RUN" --apply || rc=$?
          case "$rc" in
            0) ;;
            1) echo "::notice::предрелизная версия разошлась с площадкой — записано в задачу" ;;
            *) echo "::warning::сверка предрелизной версии не отработала (код $rc) — причина в задаче с маркером python-next" ;;
          esac
          exit 0
