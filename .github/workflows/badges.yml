# ВСЕ значки каталога. Живут на ОТДЕЛЬНОЙ ветке `badges`, а не в `main`.
#
# ПОЧЕМУ ВСЕ, А НЕ ТОЛЬКО ВЕРСИЯ. Сначала здесь публиковались только версия и
# выпуск: они свойство ИСТОРИИ, а не дерева, и в `main` под гейтом давали бы
# красную общую ветку после каждого слияния. Остальные значки — число правил,
# покрытие, число тестов, число проверок — лежали в `main` и держались
# гейтами, потому что вычисляются из дерева и детерминированы коммитом.
#
# Рассуждение было верным и цена оказалась выше, чем казалось. Значок в `main`
# требует пересборки от КАЖДОГО изменения: за одно окно это дало конфликт на
# каждом слиянии, три отставших изменения и красное на общей ветке — не потому
# что что-то сломалось, а потому что число сдвинулось. Гейт свежести значка
# краснел на верной работе, и это ровно та проверка, которую приучаются
# пропускать (правило 051).
#
# Теперь предмет один и механика одна (160): ВСЕ значки собираются здесь и
# уезжают на `badges`. В `main` их нет вовсе — там `.gitignore`. Свежесть
# держит эта работа: она запускается на каждый толчок в общую ветку, и значок
# отстаёт максимум на один толчок, без участия автора.
#
# ФАКТЫ И ЗНАЧОК ПРОЕКТА — НЕ ОТСЮДА (этап 3 #930): их рисует общий шаг
# `step-facts` механизмов джобом `facts`, как у всей семьи. Здесь — то, что
# каталог по существу: указатель, сводки «где действует» и семьи, картинки
# потребителей, версия.
#
# Схема нумерации — VERSIONING.md. Взята у грейдера, и это не SemVer.
name: badges

on:
  push:
    branches: [main]
  # Ответ потребителя сменился — сводку надо пересобрать, и делает это ТОТ ЖЕ
  # прогон, что её публикует. Второй писатель одной ветки давал бы конфликт на
  # ровном месте, а именно от него мы и уходим.
  #
  # `release` — от release.yml: страницу выпуска он создаёт токеном прогона,
  # и `release: published` ниже от такого выпуска не наступает вовсе. Событие
  # остаётся для выпуска, заведённого человеком руками.
  repository_dispatch:
    types: [summary, release]
  release:
    types: [published]
  # У события всегда есть ручная кнопка (правило 104).
  # Значок «Python │ 3.14 │ 3.15 │ 3.16» красится исходом прогонов, которые на толчке
  # ещё идут: сборка по толчку видит прошлый исход. Поэтому значки
  # пересобираются и когда основной CI или прогон следующей версии ЗАВЕРШИЛСЯ
  # на общей ветке — иначе цвет отставал бы на целое слияние.
  workflow_run:
    workflows: [ci, python-next]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # Исходы прогонов для значка Python читаются у площадки.
  actions: read

# ГРУППА ОДНА И НЕ ОТМЕНЯЕТ, А СТАВИТ В ОЧЕРЕДЬ. Прогон — единственный писатель
# ветки `badges`: внутри него пишут два джоба по очереди (`publish`, затем
# `facts`), и оба свойства держит одна эта пара строк.
#
# ГОЛОВЫ В ИМЕНИ ГРУППЫ НЕТ НАМЕРЕННО, и правило 179 сюда не достаёт: предмет
# здесь не коммит, а СОСТОЯНИЕ ветки. Голова раздробила бы группу, и два
# прогона писали бы один файл одновременно — ровно то, от чего уходили.
#
# ОТМЕНЫ НЕТ — И ЭТО ПОЧИНКА, А НЕ ВКУС. Работа просыпается на толчок в общую
# ветку И на `repository_dispatch` от `consumers-sync`, а тот отправляет
# событие через полтора десятка секунд после того же толчка. Прогоны попадали в
# одну группу, и отправленный убивал толчковый НА ХОДУ.
#
# ЗАМЕР (17.09, три слияния подряд): у 8dcaaff (#519), 366b038 (#521) и
# 3a70d9e (#522) ровно один прогон из семи завершился `cancelled` — толчковый
# `badges`; остальные шесть зелены у каждого. Площадка рисует отменённый прогон
# крестом, и общая ветка выглядела красной после каждого ТАКОГО слияния — при том что
# значки собирались и публиковались исправно. Красное на верной работе — ровно
# та проверка, которую приучаются пропускать (правило 051).
#
# ЦЕНА НАЗВАНА: толчковый прогон теперь досчитывает, и на слияние приходится
# один лишний полный проход. Убийство на ходу стоило дороже — прогон, убитый
# между коммитом и толчком, оставил бы ветку значков устаревшей МОЛЧА.
#
# ОЧЕРЕДЬ ПРОВЕРЕНА ЖИВЬЁМ, И ВОТ ЧЕМ. Слияние f4384e0 (#542) 17.09 в 12:36 —
# первое после починки, где `consumers-sync` доложил смену сводки и отправил
# событие. Столкновение состоялось, и площадка показала ровно очередь:
#
#   толчковый  #381  работа создана 12:36:08 · идёт 12:36:10 → 12:36:40
#   отправленный #382  прогон создан 12:36:20 · РАБОТА СОЗДАНА 12:36:41 → 12:37:07
#
# Отправленный прогон появился на двадцатой секунде, ПОКА толчковый был в шаге
# «значки, вычисляемые из дерева» (12:36:17 → 12:36:34), и работу под него
# площадка создала только через секунду после того, как толчковый досчитал.
# Это и есть очередь: не «крестов не было», а ждал и дождался. Оба зелены, оба
# опубликовали. С прежним `cancel-in-progress: true` толчковый умер бы в 12:36:20
# внутри ЭТОГО ЖЕ шага — с точностью до секунды там, где раньше и умирал.
#
# ШАГ ЗДЕСЬ НАЗВАН ИМЕНЕМ, А НЕ НОМЕРОМ, И ЭТО ПОЧИНКА НАХОДКИ. Стояло «внутри
# шестого шага»: шестым его считает ПЛОЩАДКА, которая приписывает своим
# первым `Set up job`, а в этом файле он пятый по счёту `steps`. Номер верен в
# одной системе отсчёта и неверен в другой, а читатель комментария считает по
# файлу, который перед ним. Имя шага однозначно в обеих.
#
# ДО ЭТОГО ЗАМЕРА ЗДЕСЬ СТОЯЛО «очередь ещё не сработала вживую», и стояло
# верно: четыре слияния подряд давали по одному прогону без отправленного, и
# зелёное на них значило «сталкиваться было не с чем». Признание держалось пять
# слияний и снято не словами, а столкновением (146).
#
# ЧТО ЭТО НЕ ЧИНИТ: площадка отменяет ОЖИДАЮЩИЙ прогон, когда в занятую группу
# приходит третий. Событий подряд столько бывает редко, но бывает, и тогда
# крест вернётся — граница названа, а не закрыта (158).
# Ожидающий заход в этой группе площадка отменяет молча, поэтому работа
# выкачивает голову ветки, а не SHA разбудившего события (199).
concurrency:
  group: badges
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # Счётчик считает по всей истории и по тегам: мелкий клон даст неверное
      # число МОЛЧА, а значок будет выглядеть свежим.
      # На workflow_run файл прогона берётся с общей ветки, и код, который он
      # исполняет, закреплён за ней же (152): права здесь — права общей ветки.
      # На прочих событиях — их собственная ссылка, как было: у выпуска это
      # тег, и значок версии считается от него, а не от ушедшей вперёд main.
      # УЧЁТНЫЕ ДАННЫЕ В ДЕРЕВЕ НЕ ОСТАВЛЯЮТСЯ (обзор #804). По умолчанию
      # checkout кладёт токен записи в .git/config, и его видит КАЖДЫЙ шаг
      # работы — в том числе скачанная проверка витрины ниже. Хэш защищает от
      # подмены её файлов, но не от того, что исполняемый код видит токен.
      # Токен нужен одной операции — толчку на ветку `badges`, — и шаг
      # публикации прописывает его сам, из своего GH_TOKEN.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      - name: зависимости для замера покрытия
        run: python -m pip install --quiet -r requirements-test.txt

      # Третий исход здесь законен и ожидаем: пока тега схемы нет, значков
      # версии и выпуска не будет, и это не поломка — это «схема ещё не
      # начата» (правило 039). ОСТАЛЬНЫЕ значки при этом собираются: они не
      # зависят от тегов, и терять их из-за отсутствующего тега было бы
      # починкой одного за счёт всех.
      - name: значки версии и выпуска
        run: |
          set -uo pipefail
          rc=0
          python scripts/version.py --badges || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning::релизного тега схемы нет — значков версии и выпуска не будет"
            # Помечаем сборку неполной: ниже по этому признаку не стирается
            # то, чего в этот прогон просто не собрали.
            echo "PARTIAL=1" >> "$GITHUB_ENV"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit 1

      # Значки, вычисляемые из дерева. Каждый считает тот, кто его придумал:
      # число правил — сборка указателя, покрытие — свой скрипт. Считать их
      # здесь заново значило бы завести вторую механику на ту же территорию.
      # Счётных значков (тесты, модули, проверки) больше нет: они
      # отвечали сопровождающему, а не посетителю, и с витрины сняты.
      - name: значки, вычисляемые из дерева
        run: |
          set -euo pipefail
          # ВЫВОД НЕ ГЛУШИТСЯ, И ЭТО ПОЧИНКА, А НЕ ВКУС. Замер 8 сентября,
          # прогон 34249776017: между «##[endgroup]» и «##[error]Process
          # completed with exit code 1» тринадцать секунд и ПУСТО. Красное на
          # общей ветке замораживает очередь целиком (053), а чинить его
          # пришлось бы гадая: третий исход обязан называть предмет (158).
          #
          # НЕМЫМ БЫЛ РОВНО ОДИН ИЗ ДВУХ, и различать их надо. `pytest` пишет
          # провалы в stdout — его `>/dev/null` глушил. У `build_rules_index.py`
          # все пять путей отказа печатают через `file=sys.stderr`, и редирект
          # stdout их не гасил: там он снят предосторожностью, а не потому, что
          # терял диагностику. Найдено внешним взглядом на этой же правке:
          # первая редакция приписывала молчание обеим командам, то есть
          # утверждала о механизме шире, чем показывает код (183).
          #
          # Соседи: у соседних `>/dev/null` — `aggregate_bindings.py` и
          # `refresh_derived.py` — отказы тоже идут в stderr, и они оставлены
          # намеренно. Шум от зелёного прогона дешевле немого красного, но
          # только там, где немота возможна.
          python scripts/build_rules_index.py
          python -m coverage run -m pytest -q
          python scripts/coverage_badge.py
          # СВОДКА СОБИРАЕТСЯ ЗДЕСЬ, ПОТОМУ ЧТО ЗДЕСЬ ЖЕ И ПУБЛИКУЕТСЯ. В общей
          # ветке её больше нет: производное с одним писателем в дереве не
          # живёт (160), а половинчатая починка — объявить писателя, оставив
          # файл, — предмет не сняла: конфликт вернулся тем же вечером, стоило
          # правилу поехать вместе с ответом о нём.
          #
          # Порядок значим: сводка строится из ответов потребителей, картинка —
          # из сводки. Обратный порядок дал бы картинку на вчерашних числах.
          python scripts/aggregate_bindings.py >/dev/null
          python scripts/refresh_derived.py >/dev/null || true
          python scripts/consumers_picture.py
          # МАНИФЕСТ И СВОДКА СЕМЬИ: номера контрактов те же, что в выгрузке, и
          # собраны уже сейчас. Манифест уезжает глобом вместе со
          # значками; сводка читает манифесты соседей, и непрочитанный сосед —
          # её строка с причиной, а не красный прогон (004).
          python scripts/family.py --manifest
          python scripts/family.py --summary
          # ОТЧЁТ ПОКРЫТИЯ — ВХОДОМ ОБЩЕГО ШАГА ФАКТОВ, а не значком здесь:
          # факты, значок проекта и разбор семьи собирает `step-facts`
          # механизмов (этап 3 #930). Число берётся из того же замера, что
          # выше, а не меряется вторым прогоном (214).
          mkdir -p "$RUNNER_TEMP/in"
          python -m coverage json -q -o "$RUNNER_TEMP/in/coverage.json"

      # Ветка `badges` осиротевшая: истории кода в ней нет, только значки.
      # Так обновление значка не заводит коммит в общей ветке и не двигает
      # счётчик, который сам же и считает.
      - name: положить на ветку badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/badges"
          mkdir -p "$tmp/.github/badges"
          # Копируется ВСЁ, что собралось. Перечислять поимённо значило бы
          # завести второй список значков рядом с .rules/showcase.json —
          # две классификации одной территории расходятся молча (049).
          cp .github/badges/*.json .github/badges/*.svg "$tmp/.github/badges/"
          # Сводка кладётся рядом с картинкой и по тому же адресу, по которому
          # её читают: `export/where.*` на ветке `badges`. Путь внутри ветки
          # сохранён намеренно — читателю меняется ВЕТКА, а не имя файла.
          mkdir -p "$tmp/export"
          cp export/where.json export/where.md export/family.json "$tmp/export/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # ДЕРЕВО ПОСЛЕ СБОРКИ ГРЯЗНОЕ, И ПЕРЕКЛЮЧИТЬСЯ С НЕГО НЕЛЬЗЯ. Сборка
          # выше переписывает производные общей ветки — с тех пор как в
          # export/rules.json появилось время сборки, файл отличается ВСЕГДА,
          # даже когда содержание то же. `git checkout badges` на таком дереве
          # отказывается: «your local changes would be overwritten».
          #
          # Замер: три прогона подряд красными (157, 158, 159 от 3 сентября),
          # и это красное на общей ветке — то есть заморозка очереди для всех.
          #
          # Собранное уже скопировано в $RUNNER_TEMP выше, поэтому здесь можно
          # выбросить рабочее дерево целиком: ветке `badges` принадлежит только
          # то, что лежит в temp.
          git checkout -- .
          git clean -fd -- export .github/badges >/dev/null 2>&1 || true

          # Токен для толчка — только здесь и только из GH_TOKEN этого шага:
          # checkout его в дереве не оставил (persist-credentials: false).
          # Заголовок той же формы, что прописывает сам checkout.
          # И СНИМАЕТСЯ на выходе из шага, при любом исходе (обзор #805): шаги
          # ниже — свои, но токену после толчка в дереве делать нечего.
          trap 'git config --local --unset-all http.https://github.com/.extraheader || true' EXIT
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"

          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch origin badges --depth 1
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi

          # ВЕТКА — ПРОЕКЦИЯ СОБРАННОГО, А НЕ НАКОПИТЕЛЬ. Значок, который
          # перестали собирать, обязан исчезнуть и отсюда: в общей ветке
          # значков нет, гейт витрины их не видит, и брошенный файл отвечал
          # бы вечно, не имея производителя. Так и вышло бы со снятыми
          # tests/test-modules/gates: копирование поверх их бы не тронуло.
          #
          # СТИРАЕТСЯ ТОЛЬКО ПРИ ПОЛНОЙ СБОРКЕ. Значки версии и выпуска
          # законно отсутствуют, пока нет тега схемы, — и зачистка в такой
          # прогон снесла бы чужой живой значок вместо своего мёртвого.
          mkdir -p .github/badges
          # ФАКТЫ, ЗНАЧОК ПРОЕКТА И РАЗБОР СЕМЬИ — НЕ НАШИ: их кладёт общий
          # шаг `step-facts` следующим джобом (перечень его `PUBLISHES`), и
          # зачистка их не трогает. Иначе каждый прогон стирал бы значок
          # витрины до того, как шаг фактов положит его заново.
          if [ "${PARTIAL:-0}" = "1" ]; then
            echo "сборка неполная — старые значки не трогаю"
          else
            find .github/badges -maxdepth 1 -type f \( -name '*.json' -o -name '*.svg' \) \
              ! -name facts.json ! -name project.svg ! -name family-check.json -delete
          fi
          cp "$tmp/.github/badges/"* .github/badges/

          # СВОДКА ПЕРЕНОСИТСЯ ОБРАТНО ТОЖЕ, И ЗАБЫТЬ ЭТО СТОИЛО ОДНОГО
          # ЗЕЛЁНОГО ПРОГОНА. 4 сентября прогон 183 отработал успешно, скопировал
          # сводку в $RUNNER_TEMP — и не положил её на ветку: обратно переносились
          # только значки. Ветка осталась без файла, ради которого его и выносили,
          # а прогон об этом не сказал ничего (146).
          #
          # Отсутствие файла здесь — ОТКАЗ, а не пропуск: сборка выше строит его
          # безусловно, и если его нет, то не отработала именно она (075).
          if [ ! -f "$tmp/export/where.json" ] || [ ! -f "$tmp/export/where.md" ] \
             || [ ! -f "$tmp/export/family.json" ]; then
            echo "::error::Сводка не собралась: $tmp/export пуст. Публиковать нечего, а молчать об этом нельзя — витрина и потребители читают её отсюда."
            exit 1
          fi
          mkdir -p export
          cp "$tmp/export/"* export/

          # `-f` нужен: в общей ветке и значки, и сводка под .gitignore, и без
          # него добавление молча не произошло бы — а сторож ниже увидел бы
          # «не изменилось» и вышел зелёным (правило 075).
          git add -f .github/badges export
          if git diff --cached --quiet; then
            echo "значки и сводка не изменились"
          else
            git commit -m "chore(ci): update badges and summary [skip ci]"
            git push origin badges
            echo "значки и сводка обновлены на ветке badges"
          fi


      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: facts-inputs
          path: ${{ runner.temp }}/in
          if-no-files-found: error
          retention-days: 1

  # ФАКТЫ, ЗНАЧОК ПРОЕКТА И СВЕРКА СЕМЬИ — ОБЩИМ ШАГОМ МЕХАНИЗМОВ, как у всей
  # семьи (этап 3 #930, решение владельца 29.10). Договор фактов держат
  # механизмы с 15.10 (ArtVsMark/Engineering-Pipeline-Mechanisms#1563); второй
  # рисовальщик того же значка разошёлся бы с первым молча (214). Факты о себе
  # публикует сам каталог на своей ветке — меняется исполнитель, а не издатель
  # (174). Тег — тот же, что у шагов конвейера в ci.yml: окно контракта в
  # .pipeline.yml одно.
  #
  # ВЕРСИЙ PYTHON В ФАКТАХ НЕТ, И ЭТО ГРАНИЦА: `python-matrix` читает ось
  # матрицы, а у каталога версии стоят отдельными работами (`catalogue`,
  # `тесты на 3.15`). Раздел уходит причиной в `none`, а не выдумывается.
  facts:
    needs: publish
    uses: ArtVsMark/Engineering-Pipeline-Mechanisms/.github/workflows/step-facts.yml@v1.11.0
    permissions:
      contents: write
      actions: read
      pull-requests: read
      issues: read
    with:
      ci-workflow: ci.yml
      inputs-artifact: facts-inputs

  showcase:
    needs: facts
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"

      # СНИМОК ВЕТКИ — ПОСЛЕ ОБОИХ ПИСАТЕЛЕЙ. Ссылки витрины сверяются с тем,
      # что на ветке лежит, а два предмета живут на разных ветках: на `badges`
      # нет ни витрины, ни скриптов. Снимок берётся `git archive`, а не
      # перечислением путей: перечень был бы вторым списком значков (049).
      - name: снимок ветки badges
        run: |
          set -euo pipefail
          git fetch --depth 1 origin badges
          mkdir -p "$RUNNER_TEMP/published"
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/published"

      # МАШИННАЯ ПОЛОВИНА ПРАВИЛА 196, и она стоит ПОСЛЕ публикации, а не до.
      # Ссылка на производное не должна уезжать в общую ветку раньше самого
      # производного; на изменении это не проверяется ничем — событие наступает
      # после слияния, а в дереве изменения предмета нет и быть не должно (160).
      #
      # ПОЧЕМУ ПОСЛЕ, А НЕ ПЕРЕД ПУБЛИКАЦИЕЙ. Сломанная ссылка живёт в тексте
      # витрины, и удержанием значков она не чинится: не опубликуй мы верно
      # собранное, устарела бы вся витрина из-за одной строки в документе.
      # Публикуем — и краснеем: находка адресована автору последнего
      # изменения и приходит в минутах, а не когда кто-то зайдёт на витрину.
      #
      # Набор читается у ВЕТКИ, а не у этого прогона: при неполной сборке
      # (нет тега схемы) ветка законно держит прежние значки, и сверка с одним
      # лишь собранным сейчас краснела бы на верной работе (051).
      - name: ссылки витрины ведут в файлы, которые на ветке есть
        run: python scripts/check_badges_published.py --published "$RUNNER_TEMP/published"
