# Гейты самого каталога. Без них правила 002 и 120 остались бы обещанием:
# скрипт, который никто не запускает, ничего не гарантирует.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Умолчание НЕ включает ready_for_review — правило 104.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      # Дата появления правила берётся из истории файла (правило 049),
      # а умолчание checkout — мелкий клон без истории.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Правило 120: указатель собирается из файлов. Падает, если правило
      # добавлено только на одном языке, номер продублирован, имена файлов в
      # деревьях разошлись или перекрёстная ссылка ведёт в никуда.
      - name: указатель актуален и деревья не разошлись
        run: python scripts/build_rules_index.py --check

      # Правило 002: разовая проверка ссылок руками ничего не гарантирует.
      - name: локальные ссылки ведут в существующие файлы
        run: python scripts/check_links.py

      # Правило 123: атрибуцию проверяют ДО слияния — историю общей ветки не
      # переписать, а объединяющее слияние составляет площадка, не автор.
      # Поэтому шаг только на PR: на push проверять уже поздно.
      # Границы диапазона идут через env, а не подстановкой в команду.
      - name: атрибуция сверена со списком согласованных имён
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_attribution.py --range "$BASE..$HEAD_SHA"

      # Правило 030: запись приезжает вместе с изменением, отдельным файлом.
      # Проверяется форма фрагментов — пустой файл выглядит сделанной работой.
      - name: фрагменты журнала изменений в порядке
        run: python scripts/collect_changelog.py --check

      # Правила 129 и 128: каталог — такой же потребитель, и отвечает за КАЖДОЕ
      # правило, а не за те, до которых дошли руки. Здесь же печатается метрика
      # из 120: сколько правил не обеспечено ничем.
      - name: каталог отвечает за каждое своё правило
        run: python scripts/check_bindings.py

      # Правило 002 же: заготовка гейта обязана хотя бы запускаться.
      - name: заготовка preflight запускается
        run: python templates/preflight.py --list

  # Отдельной работой, а не шагом в `catalogue`: у неё другой предмет и другой
  # адресат. `catalogue` отвечает на «можно ли это слить» и обязан быть зелёным,
  # иначе слить нельзя ничего. Здесь спрашивается уже слитое — итоговая история
  # общей ветки, — и красное здесь означает долг, который правкой изменения не
  # чинится. Смешать их значило бы сделать пять гейтов заложниками прошлого.
  attribution-history:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Первопредки — это вся история общей ветки, мелкого клона мало.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Правило 123 требует проверять атрибуцию в ИТОГОВОЙ истории. Итоговая —
      # это первопредки `main`, и до появления этой работы их не смотрел никто:
      # гейт на изменении зелёный, а в `main` трейлеров нет вовсе (задача #34).
      - name: атрибуция доехала до первопредков main
        run: python scripts/check_attribution.py --first-parents --ref HEAD
