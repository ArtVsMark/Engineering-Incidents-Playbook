# Гейты самого каталога. Без них правила 002 и 120 остались бы обещанием:
# скрипт, который никто не запускает, ничего не гарантирует.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Умолчание НЕ включает ready_for_review — правило 104.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  # Тело изменения спрашивается живым — см. шаг связи с задачей.
  pull-requests: read

# ГОЛОВА В ИМЕНИ ГРУППЫ — ЭТО ПОКОЛЕНИЕ ПРОГОНА (правило 179). `github.ref` на
# pull_request — `refs/pull/N/merge`, один и тот же для opened, synchronize и
# ready_for_review. Без головы все они попадают в одну группу, и вытеснить может
# более новый ПО ДОСТАВКЕ, а не по коммиту: события площадка не упорядочивает.
# Тогда `catalogue` на актуальной голове отменён, защита ветки ждёт имени,
# которого больше никто не создаст, — а событий не будет, и выводит оттуда
# только человек. Замер у потребителя: пять прогонов за 35 секунд, отменён был
# прогон на актуальной голове.
#
# Отмена при этом НЕ выключается: дубли на одной голове гасить по-прежнему надо,
# и голова именно ДОБАВЛЯЕТСЯ. Держится это гейтом check_workflows.py.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  catalogue:
    runs-on: ubuntu-latest
    # Предел выше принятых у прочих прогонов десяти: здесь единственная работа,
    # которая ставит зависимости и гоняет набор с покрытием. Без предела
    # зависшая проверка держала бы очередь до умолчания площадки — молчание
    # вместо отказа (правило 100).
    timeout-minutes: 20
    steps:
      # Дата появления правила берётся из истории файла (правило 049),
      # а умолчание checkout — мелкий клон без истории.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Правило 120: указатель собирается из файлов. Падает, если правило
      # добавлено только на одном языке, номер продублирован, имена файлов в
      # деревьях разошлись или перекрёстная ссылка ведёт в никуда.
      - name: указатель актуален и деревья не разошлись
        run: python scripts/build_rules_index.py --check

      # Правило 002: разовая проверка ссылок руками ничего не гарантирует.
      - name: локальные ссылки ведут в существующие файлы
        run: python scripts/check_links.py

      # Ключ --require-declared-author включён по задаче #79: проверка автора
      # была ЗАПРЕТИТЕЛЬНОЙ — «автором не должен стоять известный соавтор», —
      # ловила одно написание и молчала на `claude[bot]`. Так изменение #78 и
      # уехало в общую ветку авторства бота, а переписать там нечем (114).
      # Разрешительный список ломается в другую сторону: новый человек
      # получает отказ и приходит с этим (правило 068).
      # Правило 123: атрибуцию проверяют ДО слияния — историю общей ветки не
      # переписать, а объединяющее слияние составляет площадка, не автор.
      # Поэтому шаг только на PR: на push проверять уже поздно.
      # Границы диапазона идут через env, а не подстановкой в команду.
      - name: атрибуция сверена со списком согласованных имён
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_attribution.py --range "$BASE..$HEAD_SHA" --require-declared-author

      # Правило 064: изменение без строки связи НЕ закрывает задачу при
      # слиянии — трекер начинает врать, и задача висит открытой после того,
      # как сделана. Замер по #120: двенадцать слияний подряд, задача названа
      # в заголовке, закрыто ноль. Шаг только на PR: предмет здесь — тело
      # изменения, а на push его не существует.
      # Освобождение предусмотрено явное и заполненное — «Без задачи, потому
      # что…», — потому что 064 требует именно поля с причиной, а не пустоты.
      # ТЕЛО СПРАШИВАЕТСЯ ЖИВЫМ, А НЕ БЕРЁТСЯ ИЗ СОБЫТИЯ. `github.event` — это
      # снимок, сделанный в момент события, и он НЕ обновляется: правка тела
      # изменения его не трогает, а пере-прогон проигрывает тот же снимок
      # заново. Замер: тело поправлено, `rerun_failed_jobs` запущен, гейт
      # снова прочитал старое и снова отказал. Правило 148 на третьем за день
      # артефакте — запись состояния есть кэш, отстающий от событий.
      - name: изменение связано с задачей или освобождено с причиной
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --json body --jq .body > "$RUNNER_TEMP/pr-body.md"
          python scripts/pr_body.py --check --body-file "$RUNNER_TEMP/pr-body.md"

      # Правило 064 объявляло себя обеспеченным гейтом, а держало ДРУГУЮ свою
      # половину: `labels-sync.yml` применяет НАБОР меток к репозиторию, а
      # `pr_body.py` проверяет связь с задачей. Того, что изменение несёт зону,
      # не проверял никто, и замер это показал: у последних десяти изменений
      # метки не было НИ У ОДНОГО. Нашёл владелец глазами, а не механизм.
      #
      # Зона ВЫВОДИТСЯ из тронутых путей, а не требуется от человека: инцидент
      # самого 064 — «машина метила исправнее человека». Ставит её `agent-pr`,
      # здесь только сверка.
      - name: зона изменения проставлена
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE...HEAD" > "$RUNNER_TEMP/paths.txt"
          have=$(gh pr view "$PR" --json labels --jq '[.labels[].name] | join(",")')
          python scripts/check_labels.py \
            --paths-from "$RUNNER_TEMP/paths.txt" --have "$have"

      # Правило 030: запись приезжает вместе с изменением, отдельным файлом.
      # Проверяется форма фрагментов — пустой файл выглядит сделанной работой.
      - name: фрагменты журнала изменений в порядке
        run: python scripts/collect_changelog.py --check

      # Задача #104: фильтр «тянет ли это на правило» есть и работает машинно,
      # но срабатывает для того, кто УЖЕ решил писать. Момента, в который это
      # решают, не было — и замер по корпусу показывает форму пропажи: записи
      # появляются пачками там, где кто-то садился их писать, а не по одной
      # вслед за починками.
      # Момент здесь потому, что фрагмент журнала пишут ровно тогда, когда
      # починка сделана и инцидент ещё цел (правило 138). Спрашивается только
      # у ДОБАВЛЕННЫХ этим изменением: со старых задним числом вышли бы два
      # десятка отписок, то есть ровно то, чего не хочет 026.
      - name: починка ответила, тянет ли она на правило
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/collect_changelog.py --check --added-since "$BASE"

      # Правило 138: решение оседает артефактом ТЕМ ЖЕ заходом, а не перед
      # выпуском. Отложенная запись означает, что следующее окно разбирает тот
      # же вопрос заново.
      #
      # ЗАМЕР, А НЕ ОПАСЕНИЕ: из 34 изменений общей ветки, тронувших поведение,
      # запись несут 34 — ноль нарушений. Гейт не чинит поломку, он снимает
      # правило с дисциплины (002): дисциплина, о которой известно, что она
      # стопроцентна, ломается ровно один раз и незаметно.
      #
      # У ОТКАЗА ЕСТЬ НАЗВАННЫЙ ВЫХОД — строка «Журнал: не требуется — причина»
      # в теле изменения. Без выхода гейт обходили бы пустым фрагментом, а
      # пустой фрагмент хуже отсутствующего: он выглядит памятью (126).
      - name: запись журнала едет вместе с изменением
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BASE...HEAD" > "$RUNNER_TEMP/paths.txt"
          gh pr view "$PR" --json body --jq .body > "$RUNNER_TEMP/body.md"
          python scripts/collect_changelog.py --require-entry \
            --paths-from "$RUNNER_TEMP/paths.txt" \
            --body-file "$RUNNER_TEMP/body.md"

      # Правила 129 и 128: каталог — такой же потребитель, и отвечает за КАЖДОЕ
      # правило, а не за те, до которых дошли руки. Здесь же печатается метрика
      # Правило 049: таблица «где действует» вычисляется из ответов
      # потребителей, а не ведётся руками. Объявленный потребитель, чей ответ
      # не читается, роняет сборку — иначе «не смогли прочитать» неотличимо от
      # «у него всё хорошо» (правило 075).
      #
      # СБОРКА, А НЕ СВЕРКА, И ЭТО СЛЕДСТВИЕ ВЫНОСА. Сводки в дереве больше нет
      # — она живёт на ветке `badges` (160), — значит сверять свежесть не с чем
      # и незачем: изменение не может её состарить. Осталось то, ради чего шаг
      # и стоял: читаются ли ответы потребителей вообще.
      #
      # Порядок значим: следующий шаг спрашивает у каталога ответ о себе и
      # показывает, что из очереди «ничем» уже решено у соседа, — а это он
      # берёт из собранной сводки.
      - name: сводка «где действует» собирается из ответов потребителей
        run: python scripts/aggregate_bindings.py

      # из 120: сколько правил не обеспечено ничем.
      - name: каталог отвечает за каждое своё правило
        run: python scripts/check_bindings.py

      # Правило 002: разделы на месте — это ещё не запись. Заголовок можно
      # поставить и оставить под ним что угодно: «Применимость» без границы
      # «не работает» структурно неотличима от полной, а след из одной
      # прозаической фразы — от следа, ведущего в живой артефакт.
      - name: записи полны по содержанию, а не только по форме
        run: python scripts/audit_catalogue.py

      # Правила 022 и 082: у свода не было владельца, и он трижды за одно окно
      # разошёлся с фактом — обещанным числом гейтов, формой следа, картой
      # направлений. Канон здесь — шаги этой работы: их исполняет площадка, а
      # строку в документе не исполняет никто.
      - name: свод и документ для участника называют те же гейты
        run: python scripts/check_charter.py

      # Задача #91: 143 переоткрыло то, что уже говорили 131 и 135. Механизма,
      # который спросил бы «нет ли уже такого правила», не было — окно перед
      # записью не искало по каталогу вовсе. Гейт не судит о дубле: порога у
      # метрики нет, и это измерено (заголовок скрипта). Он требует, чтобы
      # вопрос был задан.
      - name: у нового правила спрошено о соседях
        run: python scripts/check_duplicates.py --check

      # Правило 080 держалось шагом процесса, то есть ничем машинным, и это
      # измерено по корпусу: из 143 записей 129 родились в грейдере. Здесь
      # проверяется вердикт каталога о приехавших предложениях — цел ли он и
      # сходится ли с корпусом. Наружу шаг НЕ ходит: опрос потребителей живёт
      # в consumers-sync, обязательная проверка не зависит от чужого сервера.
      - name: вердикт о предложениях из проектов сходится с корпусом
        run: python scripts/collect_proposals.py --check

      # Правила 140 и 097: зелёный прогон на хорошем входе подтверждает, что
      # гейт запускается, и ничего больше. Здесь гейтам подсовывают предмет,
      # который они обязаны отвергнуть.
      - name: гейты отвергают то, что обязаны
        run: python scripts/check_gates.py

      # Задача #61: наблюдение из чужого проекта без своего инцидента лежит
      # в candidates/ помеченной гипотезой. Папка «почти правил» — готовый
      # обход требования инцидента, и обход происходит сползанием: сперва на
      # кандидата ссылается правило, потом свод, потом никто не помнит, что
      # это гипотеза. Здесь держится граница, и главное в ней — ссылки.
      - name: кандидаты не притворяются правилами
        run: python scripts/check_candidates.py

      # Задача #105: набор вопросов витрины один на все проекты, иначе их не
      # сравнить и никто не заметит, что один перестал отвечать (022). А
      # вопрос без предмета НАЗЫВАЕТСЯ, а не опускается: значка нет и значок
      # застыл с витрины неотличимы (046, 075).
      - name: витрина отвечает на весь объявленный набор
        run: python scripts/check_showcase.py
      # Дежурный по общей ветке заводит задачу по чужому красному, и ошибка в
      # его свёртке молчалива в обе стороны: пропущенное красное не заметит
      # никто, а ложное приучит закрывать задачу не читая. Набор двусторонний.
      - name: дежурный отличает красное от зелёного
        run: python scripts/main_red.py --selftest

      # Обратная ссылка пишет в ЧУЖОЙ трекер, и цена ошибок несимметрична:
      # пропущенный след это состояние «как было», а ложный — комментарий
      # «отсюда выросло правило» в чужом месте, который читатель не проверит.
      - name: обратная ссылка находит свои следы и не берёт чужие
        run: python scripts/link_trails.py --selftest

      # Пересборка производных КОММИТИТ БЕЗ ЧЕЛОВЕКА, и обе её ошибки тихие:
      # пропущенное изменение оставит сводку отставшей при зелёном прогоне, а
      # лишний файл в наборе уедет в общую ветку никем не прочитанным. Набор
      # двусторонний и проверяет саму границу: что считается свежими данными,
      # что — поломкой сборщика, а что — правкой человека, до которой прогону
      # дела нет.
      - name: пересборка производных знает свою границу
        run: python scripts/refresh_derived.py --selftest

      # Правила 126 и 100 объявляли себя выполненными и не держались ничем.
      # Оба ответа разошлись с фактом: кнопку в agent-pr.yml пришлось ставить
      # рукой, а предела времени не было у работ ЭТОГО файла и у
      # attribution-history — то есть у тех двух, что дольше всех.
      - name: у прогонов есть кнопка, у работ — предел времени
        run: python scripts/check_workflows.py

      # САМОПРОВЕРКА БЫЛА НАПИСАНА И НЕ ЗАПУСКАЛАСЬ. Шаг «зона изменения
      # проставлена» ниже живёт только на pull_request и проверяет РЕАЛЬНЫЕ
      # метки — это положительный предмет. Отрицательного у гейта не было:
      # `--selftest` существовал и его не звал никто, то есть ровно тот случай,
      # которым стоило правило 040 у грейдера. Найдено подъёмом метрики
      # «без отвергаемого предмета» до отказа (140, 146).
      # Правило 176: умолчание из окружения матрица не доказывает — дефект
      # требует совпадения платформы и данных. Разбор исходника отвечает
      # всегда, и потому проверка здесь, а не в ячейке прогона.
      - name: текстовый вызов называет кодировку
        run: python scripts/check_subprocess.py

      # Правило 158: «проверка не отработала» без адреса неотличима от
      # «сломалось что-то». Разбор исходника, а не прогон: третий исход тем и
      # неудобен, что наступает редко, — ждать его значило бы проверять гейт
      # тогда, когда он уже не сработал. Замер при заведении: 19 сообщений из
      # 43 скриптов с третьим исходом не называли предмета вовсе.
      - name: третий исход называет предмет отказа
        run: python scripts/check_third_outcome.py

      # Правила 033 и 169: темп прогона по расписанию выводится АРИФМЕТИЧЕСКИ
      # из бюджета, а роль его объявлена. Шаг считает, а не ищет слова: сколько
      # вызовов наружу расписания просят в худший ЧАС (квота часовая и
      # скользящая — суточное усреднение зеленеет перед отказом) и укладывается
      # ли сумма по всем расписаниям этого часа в объявленную долю. Сумма, а не
      # каждый по отдельности: квота общая (058).
      - name: темп по расписанию выведен из бюджета
        run: python scripts/check_schedules.py

      # Правило 170: зелёное на подделке — тоже гипотеза. Шаг держит
      # ПРЕДПОСЫЛКУ сверки: у набора, подменяющего шов наружу, назван адрес, по
      # которому настоящий ответ снимается заново. Сама сверка требует сети, в
      # конвейер гейтов не ходит намеренно и остаётся человеку — это названо
      # границей в докстроке, а не замолчано (075).
      - name: у подделки назван источник
        run: python scripts/check_forgeries.py

      # Правило 144: контекст человеческого текста берут АБЗАЦЕМ, а не
      # «предложением до ближайшей точки» — точка стоит внутри имён
      # (SECURITY.md, v1.2.0). Гейт держит не суждение «проза ли это» —
      # различить путь модуля и абзац по коду нельзя, — а то, что решение
      # принято вслух у каждого разреза.
      - name: разрез текста объявляет, что режет
        run: python scripts/check_text_cuts.py

      # Правило 181: «X читают ТОЛЬКО отсюда» связывает весь документ, а не
      # раздел. Два таких утверждения об одном предмете друг друга не уточняют
      # — каждое запрещает второе, и оба перестают действовать. Шаг НЕ судит:
      # порога у меры нет, и на замере грейдера самая близкая пара оказалась
      # законной, а настоящее противоречие стояло вторым. Он требует ОТВЕТА по
      # верхним парам — так же и по той же причине, что check_duplicates.
      - name: исключительные утверждения сверены друг с другом
        run: python scripts/check_exclusive.py --check

      - name: зоны выводятся из путей верно
        run: python scripts/check_labels.py --selftest

      # Правило 173: вторая половина живёт по ту сторону слияния и предмета на
      # изменении не имеет. Здесь прогоняется её разбор и вердикт — иначе
      # механизм подтверждался бы только тем, что запускается (139, 145).
      - name: состояние задачи после слияния судится верно
        run: python scripts/check_task_state.py --selftest

      # Правила 008 и 035 стояли в очереди «не дошли руки» с пометкой
      # «предмет счётный». Счётный он оказался наполовину: спойлер ловится по
      # тексту целиком, а версия — только в манифесте, потому что поиск числа
      # по дереву даёт шестнадцать законных файлов на ноль настоящих (005, 051).
      # Правило 062: направление без своего возражения — раздел документации,
      # а не роль. Признак машинный и доступный: возражение либо стоит в
      # строке карты, либо его нет. До этого шага карту читал человек, и
      # дважды она объявляла покрытыми направления без возражения вовсе.
      # Правило 022 на новой поверхности: 2 сентября репозиторий переименован,
      # и в дереве осталось 245 упоминаний старого имени — контракт, действия,
      # заготовка ответа, реестр. Перенаправление площадки сработало, и потому
      # расхождение не проявилось ничем: оба адреса отвечали 200. Узналось оно
      # из предупреждения `git push`, а не из проверки.
      # Правило 159: список находок читают ПОСЛЕ последнего случая. Ранний
      # выход превращает всё, что идёт следом, в непроверенное — и делает это
      # молча: вердикт напечатан, код возврата есть, половина предметов не
      # рассмотрена. Третий исход при этом законен и обязан быть ранним, и
      # гейт различает их по константе, а не по слову «return».
      - name: вердикт выносится после последнего случая
        run: python scripts/check_verdict_order.py

      - name: каталог знает своё имя
        run: python scripts/check_own_name.py

      - name: у каждой роли своё возражение и назван адресат
        run: python scripts/check_roles.py

      - name: в тексте нет вписанного рукой
        run: python scripts/check_prose.py

      # Правило 005 с другой стороны: есть одно место, где число в прозе
      # законно, — снимок на момент выпуска. Он не протухает, но и не
      # появляется сам: после v0.1.0 вышли два выпуска, и строк никто не
      # дописал. Здесь у каждого тега спрашивается своя строка, а её числа
      # сверяются с деревом самого тега — руками их не подделать.
      # Теги нужны живьём, и потому этот шаг стоит только здесь: клон выше
      # взят с fetch-depth 0.
      - name: у каждого выпуска есть строка в эволюции метрик
        run: python scripts/history_metrics.py --check

      # Правило 077: совпадение ключей — ещё не перевод. Структурный паритет
      # держит build_rules_index, но запись, положенную в rules/en/ ПО-РУССКИ,
      # он не видит: разделы на месте, имена совпадают. Ловится языком —
      # долей кириллицы, порог замерен на корпусе (en ≤ 2% против потолка 15%,
      # ru ≥ 81% против пола 50%). Приём взят у витрины.
      - name: английское дерево переведено, а не скопировано
        run: python scripts/check_locale.py

      # Правило 040: пропуск без причины неотличим от забытого теста. Сегодня
      # пропусков ноль — и это состояние, а не пустота: предмет проверки здесь
      # набор тестов, а он не пуст. У соседа тот же скрипт полтора месяца не
      # запускался ничем, поэтому здесь он шагом конвейера, а не командой.
      - name: пропущенный тест называет причину
        run: python scripts/check_skips.py

      # Правило 021: документацию делят по читателю, а не по теме. Держалось
      # ничем — «делим по читателю» было намерением, а намерение не проверить.
      # Цена заплачена в тот же день: у подключающегося проекта документа не
      # было вовсе. Раскладка по каталогам, как у грейдера, здесь не годится —
      # README, CONTRIBUTING и AGENTS имеют для площадки своё значение в корне,
      # — поэтому читателя называет строка в самом документе.
      - name: у каждого документа назван читатель
        run: python scripts/check_readers.py

      # Правило 163: инструмент, отданный наружу, назван на входе, а не в
      # журнале за тот день, когда его построили. Замер, с которого правило и
      # началось: команда подключения не упомянута ни в README, ни в START, ни
      # в контракте, и первый день нового проекта состоял из одних заготовок.
      - name: вход в проект называет инструменты, и они существуют
        run: python scripts/check_connect.py

      # Правило 155: заготовка, которой не пользуешься сам, расходится с
      # практикой молча — и проверка «она запускается», стоящая ниже, этого не
      # ловит: запускаются обе, и рабочая, и разошедшаяся.
      - name: заготовки сказали, чем они применяются у себя
        run: python scripts/check_templates.py

      # Правило 107: «у автора работает» означает «проверено на выборке
      # автора». Новый набор импортировал yaml — у автора библиотека стояла,
      # набор был зелёный, в конвейере её не было, и прогон упал на импорте.
      # Здесь проверяется, что каждый импорт тестов объявлен, а не случайно
      # установлен.
      - name: тесты зависят только от объявленного
        run: python scripts/check_test_deps.py

      # Правило 002 же: заготовка гейта обязана хотя бы запускаться.
      - name: заготовка preflight запускается
        run: python templates/preflight.py --list

      # Свой прогон перед толчком читает шаги ЭТОГО файла, и сломать его можно
      # правкой конвейера, а не его собственной: сменится отступ или форма
      # шага — план опустеет, и «чисто» станет означать «ничего не запускали».
      # Здесь он обязан хотя бы собрать план; что план сходится с конвейером,
      # держит tests/test_preflight.py.
      - name: прогон перед толчком собирает план
        run: python scripts/preflight.py --list

      # ── ТЕСТЫ И ПОКРЫТИЕ ──────────────────────────────────────────────────
      #
      # До них каталог проверялся только гейтами по ЖИВЫМ данным. Они ловят
      # порчу содержимого — правило на одном языке, ссылку в никуда, — но про
      # сами скрипты не говорят ничего: краевой вход им никто не подсовывал.
      # А два исхода из трёх (039) как раз и живут на краю.
      #
      # Зависимости ставятся здесь, а не выше: все прежние шаги обходятся
      # стандартной библиотекой, и тащить установку в начало значило бы
      # замедлить каждый из них ради последнего.
      - name: обвязка тестов
        run: python -m pip install --quiet -r requirements-test.txt

      - name: тесты проходят
        run: python -m coverage run -m pytest

      # ЗНАЧКА ПОКРЫТИЯ ЗДЕСЬ БОЛЬШЕ НЕТ, и это решение, а не пропуск. Гейт
      # свежести значка стоял здесь и был верен по замыслу: число в артефакте
      # ставит сборка (005). Цена оказалась выше замысла — значок в `main`
      # требует пересборки от КАЖДОГО изменения, и за одно окно это дало
      # конфликт на каждом слиянии и красное на общей ветке не потому, что
      # сломалось, а потому что число сдвинулось. Проверка, краснеющая на
      # верной работе, — та самая, которую приучаются пропускать (051).
      # Все значки уехали на ветку `badges`, свежесть держит badges.yml на
      # каждый толчок в main, и автор изменения к ней не причастен.
