# Выпуск договора фактов семьи: тег facts-v<номер> и страница с пятью файлами.
#
# ЧТО ВЫПУСКАЕТСЯ. Договор фактов, а не каталог: схема, проза, проверка, номер
# и образец. Издатель прибивает проверку к тегу и гоняет у себя тот же файл,
# которым его судит читатель. Номер — export/facts/facts.version, и только
# там. С 2.0 договор держит каталог (#843); выпуски facts-v1.x — у витрины.
#
# ПОЧЕМУ КНОПКОЙ И ПО УМОЛЧАНИЮ ВХОЛОСТУЮ. Тег не переставляется: на него
# прибивается вся семья. Сухой заход собирает и проверяет то же самое, что
# выпустил бы, и ничего не ставит; выпуск — флажком apply.
#
# ПОЧЕМУ ТОКЕН ЧЕЛОВЕКА. Тег и страница несут личность того, кто выпустил
# (131): штатный токен сделал бы автором бота. Секрет тот же, что у release.yml.
name: facts-release

on:
  # У необратимого шага есть только ручная кнопка: событие, выпускающее само,
  # выпустило бы на первой же правке номера, не спросив человека (074).
  workflow_dispatch:
    inputs:
      apply:
        description: "поставить тег и завести страницу; без флажка — сухой заход"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: facts-release
  cancel-in-progress: false

jobs:
  release:
    name: facts-release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
    steps:
      # Тег ставится на то, что выпущено, — на общую ветку. С рабочей ветки он
      # пометил бы договор, которого в main нет. Сухой заход ничего не ставит
      # и законен с любой ветки: так правку выпуска проверяют до слияния
      # (обзор #849). Первый прогон всё равно после слияния — кнопку площадка
      # даёт только прогону, который уже лежит в общей ветке.
      - name: выпуск — только с общей ветки
        if: inputs.apply && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Выпуск договора фактов запускается с main, а не с ${GITHUB_REF}: тег пометил бы то, чего в общей ветке нет."
          exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # Собрать пять файлов плоско и проверить их там же отдельным
      # интерпретатором — ровно положение издателя. Стоящий тег — отказ.
      - name: собрать и проверить выпуск
        id: plan
        run: python scripts/facts_release.py --dist "$RUNNER_TEMP/facts-release" --notes "$RUNNER_TEMP/facts-notes.md"

      # Страница без тега не бывает, а тег без страницы бывает — его проверил
      # шаг выше. Здесь второе: страница с таким тегом уже заведена.
      - name: страницы выпуска ещё нет
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Страница выпуска $TAG уже есть — второй не заводим, тег не переставляем. Поднимите номер в export/facts/facts.version."
            exit 1
          fi

      - name: выпустить
        if: inputs.apply && env.MERGE_QUEUE_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          NUMBER: ${{ steps.plan.outputs.number }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$RUNNER_TEMP"/facts-release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Договор фактов $NUMBER" --notes-file "$RUNNER_TEMP/facts-notes.md"
          echo "::notice::Выпуск $TAG поставлен на $GITHUB_SHA, файлов: $(ls "$RUNNER_TEMP"/facts-release | wc -l)."

      - name: выпуск не сделан — сказано, а не пропущено
        if: inputs.apply && env.MERGE_QUEUE_TOKEN == ''
        run: |
          echo "::error::Выпуск запрошен, но MERGE_QUEUE_TOKEN не задан: тег несёт личность человека, и штатным токеном его ставить нельзя."
          exit 1

      - name: сухой заход
        if: ${{ !inputs.apply }}
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          echo "::notice::Сухой заход: $TAG собран и проверен, ничего не поставлено. Выпуск — та же кнопка с флажком apply."
          cat "$RUNNER_TEMP/facts-notes.md"
