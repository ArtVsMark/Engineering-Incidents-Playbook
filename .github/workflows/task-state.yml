# Что стало с задачей ПОСЛЕ слияния (правило 173).
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ ПРОГОН. Гейт изменения проверяет ФОРМУ ответа — там предмета
# «что стало с задачей» ещё нет. Врёт строка `Closes` именно после слияния:
# площадка закрыла не то, не закрыла ничего, или задача стоит с описанием
# работы, которой больше нет. Проверка до события проверяет намерение (139).
#
# ПОЧЕМУ ПРЕДУПРЕЖДЕНИЕ, А НЕ КРАСНОЕ. Расхождение живёт в ТРЕКЕРЕ, а не в
# дереве: правкой изменения его не снять, а красное на общей ветке замораживает
# очередь целиком (053). Красное, которое нельзя снять своей работой,
# перестают читать (051). Адресат у находки есть и он точный — комментарий в
# самой задаче (142).
name: task-state

on:
  push:
    branches: [main]
  # У события всегда есть ручная кнопка (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: task-state-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Предел времени обязателен у каждой работы (правило 100).
    timeout-minutes: 10
    env:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
    steps:
      # Замечание пишется в задачу токеном владельца: с токеном по умолчанию
      # автором комментария станет приложение (правила 131, 135).
      - name: токен владельца не задан
        if: env.MERGE_QUEUE_TOKEN == ''
        run: |
          echo "::warning::MERGE_QUEUE_TOKEN не задан — состояние задач не проверяется: чтение трекера и замечание требуют токена владельца."
          echo "SKIP=1" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        if: env.SKIP != '1'
        with:
          fetch-depth: 1

      - name: состояние задач сходится с обещанием изменения
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN }}
        run: |
          set -uo pipefail
          git log -1 --format=%B > "$RUNNER_TEMP/body.txt"
          out=$(python3 scripts/check_task_state.py \
                  --body-file "$RUNNER_TEMP/body.txt" --comment 2>&1); code=$?
          printf '%s\n' "$out"
          # Три исхода различаются, и второй не растворяется в третьем (039).
          if [ "$code" -eq 2 ]; then
            echo "::warning::Состояние задач не прочитано — проверка не отработала."
          elif [ "$code" -ne 0 ]; then
            echo "::warning::Задачи разошлись с тем, что обещало изменение — замечание оставлено в самой задаче."
          fi
