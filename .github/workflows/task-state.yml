# Что стало с задачей ПОСЛЕ слияния (правило 173).
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ ПРОГОН. Гейт изменения проверяет ФОРМУ ответа — там предмета
# «что стало с задачей» ещё нет. Врёт строка `Closes` именно после слияния:
# площадка закрыла не то, не закрыла ничего, или задача стоит с описанием
# работы, которой больше нет. Проверка до события проверяет намерение (139).
#
# ПОЧЕМУ ПРЕДУПРЕЖДЕНИЕ, А НЕ КРАСНОЕ. Расхождение живёт в ТРЕКЕРЕ, а не в
# дереве: правкой изменения его не снять, а красное на общей ветке замораживает
# очередь целиком (053). Красное, которое нельзя снять своей работой,
# перестают читать (051). Адресат у находки есть и он точный — комментарий в
# самой задаче (142).
name: task-state

on:
  push:
    branches: [main]
  # У события всегда есть ручная кнопка (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: task-state-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Предел времени обязателен у каждой работы (правило 100).
    timeout-minutes: 10
    env:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
    steps:
      # Замечание пишется в задачу токеном владельца: с токеном по умолчанию
      # автором комментария станет приложение (правила 131, 135).
      - name: токен владельца не задан
        if: env.MERGE_QUEUE_TOKEN == ''
        run: |
          echo "::warning::MERGE_QUEUE_TOKEN не задан — состояние задач не проверяется. Нужен токен владельца с правами issues:read (прочитать состояние задачи), issues:write (оставить в ней замечание) и pull-requests:read (обещание живёт в теле ИЗМЕНЕНИЯ, а не слияния — по коммиту спрашивается слитое им изменение). Право на задачи нужно ЕДИНСТВЕННОМУ прогону каталога — этому: у agent-pr и automerge предмет pulls, у consumers-sync contents, у thaw actions — их зелень об этом праве не говорит ничего."
          echo "SKIP=1" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        if: env.SKIP != '1'
        with:
          fetch-depth: 1

      - name: состояние задач сходится с обещанием изменения
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN }}
        run: |
          set -uo pipefail
          # ТЕЛО КОММИТА — ЗАПАСНОЙ ИСТОЧНИК, А НЕ ОСНОВНОЙ. Обещание живёт в
          # теле ИЗМЕНЕНИЯ: тело squash-коммита `automerge` собирает заново, из
          # одних трейлеров, и `Closes`/`Part of` в него не попадает никогда.
          # Выбор источника живёт в скрипте, а не здесь: строкой оболочки он
          # проверялся бы только настоящим слиянием, то есть после того, как
          # ответ уже потерян (018, урок 7 сентября про pr_source_commit.py).
          git log -1 --format=%B > "$RUNNER_TEMP/body.txt"
          # Площадка зовёт шаг как `bash -e {0}`, и `set -uo pipefail` этот
          # `-e` НЕ снимает. Без `|| code=$?` оболочка умирает на ненулевом
          # коде раньше разбора: и `printf`, и обе ветки ниже — код, до
          # которого не доходит управление (правило 145).
          code=0
          out=$(python3 scripts/check_task_state.py \
                  --sha "$GITHUB_SHA" \
                  --body-file "$RUNNER_TEMP/body.txt" --comment 2>&1) || code=$?
          printf '%s\n' "$out"
          # Три исхода различаются, и второй не растворяется в третьем (039).
          if [ "$code" -eq 2 ]; then
            echo "::warning::Состояние задач не прочитано — проверка не отработала. Первое, что стоит проверить: есть ли у MERGE_QUEUE_TOKEN право issues:read. Ответ площадки и остаток квоты напечатаны выше — диагностика начинается с них, а не с гипотез (017)."
          elif [ "$code" -ne 0 ]; then
            echo "::warning::Задачи разошлись с тем, что обещало изменение — замечание оставлено в самой задаче."
          fi
