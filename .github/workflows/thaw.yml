# Разморозка очереди: позеленевшее основание перевзводит стоящие изменения.
#
# ИНЦИДЕНТ, РАДИ КОТОРОГО ЗАВЕДЕНО. 2 сентября изменение #283 простояло час
# зелёным и не слитым. Заморозка сработала в 15:46:58 — на общей ветке в тот
# момент последним ЗАВЕРШЁННЫМ прогоном `ci` был отменённый конкурентностью, а
# следующий ещё шёл. Через тридцать секунд основание стало зелёным, и это
# ничего не изменило: `automerge` заводится событиями САМОГО изменения, а их
# больше не было. Изменение #280 спаслось только тем, что его толкнули десятью
# минутами позже.
#
# Это второй инцидент правила 126 — «у заморозки должен быть выход, не
# проходящий через замороженное действие». Первый стоил пяти часов и восьми
# изменений; ответ каталога называл механизмом ручную кнопку, то есть держал
# ровно половину: кнопка есть, а РАВНОСИЛЬНОГО ИСТОЧНИКА, который снимает
# условие сам, не было. Границы 126 требуют именно его — «доказательство
# „условие снято“ принимается от любого равносильного источника, а не от
# одного события».
#
# ПОЧЕМУ НЕ РАСПИСАНИЕ. Страховка расписанием здесь запрещена правилом 169:
# планировщик площадки говорит «когда-нибудь» — замер соседа даёт десять
# срабатываний вместо семидесяти двух за тридцать шесть часов. Очередь обязана
# двинуться за минуты, значит разморозка идёт по СОБЫТИЮ, а расписание не
# заводится вовсе, чтобы не выглядеть страховкой, которой оно не является.
#
# ПОЧЕМУ ПЕРЕЗАПУСК `automerge`, А НЕ СВОЯ ЛОГИКА. Решение «можно ли сливать»
# живёт в одном месте (022): здесь только повод пересмотреть, а не второй
# экземпляр правил. Расхождение двух копий было бы молчаливым.
name: thaw

on:
  # Позеленевший прогон общей ветки — то самое равносильное событие. Оно
  # приходит от площадки и заморозкой не блокируется.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # У события всегда есть ручная кнопка (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: thaw
  cancel-in-progress: true

jobs:
  rearm:
    # Красное основание разморозки не даёт: перевзводить очередь на нём значило
    # бы отменить саму заморозку (053).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Предел времени обязателен у каждой работы (правило 100).
    timeout-minutes: 10
    env:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
    steps:
      # Секрета нет — предупреждение и выход, а не отказ: это ненастроенная
      # возможность, а не поломка (051). Тот же ответ, что у automerge.
      - name: токен владельца не задан
        if: env.MERGE_QUEUE_TOKEN == ''
        run: |
          echo "::warning::MERGE_QUEUE_TOKEN не задан — размораживать нечем: перезапуск automerge требует того же токена владельца."
          echo "SKIP=1" >> "$GITHUB_ENV"

      - name: перевзвести автомерж на стоящих изменениях
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN }}
        run: |
          set -uo pipefail
          # ПО REST, А НЕ ЧЕРЕЗ GraphQL: у второго своя узкая квота, и 2
          # сентября она кончилась — конвейер встал целиком при зелёном коде.
          if ! pulls=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100"); then
            echo "::warning::Список открытых изменений не прочитан — не размораживаю."
            exit 0
          fi

          # Черновик не берут (он «ещё не беру»), и уже взведённый тоже:
          # повторное включение ничего не меняет, а лишний вызов стоит квоты.
          стоящие=$(printf '%s' "$pulls" \
            | jq -r '.[] | select(.draft == false and .auto_merge == null) | .number')

          if [ -z "$стоящие" ]; then
            echo "перевзводить нечего: стоящих изменений без автомержа нет"
            exit 0
          fi

          # Третий исход виден отдельно (039): «перевзвёл ноль, потому что
          # некого» и «перевзвёл ноль, потому что не смог» — разные ответы.
          сбои=0
          for pr in $стоящие; do
            if gh workflow run automerge.yml -f pr="$pr"; then
              echo "изменение #$pr: автомерж перевзведён — основание позеленело"
            else
              echo "::warning::Изменение #$pr: перезапуск automerge не удался."
              сбои=$((сбои + 1))
            fi
          done
          if [ "$сбои" -ne 0 ]; then
            echo "::warning::Не перевзведено изменений: $сбои."
          fi
