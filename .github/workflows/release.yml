# Держит правило каталога 005: числа выпуска берёт сборка из самих записей,
# а не человек из головы.
#
# Выпуск релиза. Схема — VERSIONING.md, и это НЕ SemVer: тег ставится только на
# границе MINOR, поэтому все теги имеют вид vX.Y.0.
#
# ПОЧЕМУ КНОПКА, А НЕ АВТОМАТ. Постановка тега и публикация релиза несут личность
# человека, а на записи из агентского окна прокси подменяет учётные данные
# (правило 131). Кнопку жмёт владелец; окно готовит журнал и проверяет форму.
#
# ПОЧЕМУ ПРОВЕРКИ ДО ПУБЛИКАЦИИ, А НЕ ПОСЛЕ. Тег в общей ветке не переписать, а
# пустое тело релиза читается как «ничего не изменилось» — хуже, чем отсутствие
# релиза (правило 075: страж, который ничего не нашёл, обязан краснеть).
#
# ДОЗАВЕРШЕНИЕ — ТОЙ ЖЕ КНОПКОЙ. Выпуск, упавший ПОСЛЕ тега, повтором не
# чинился: 27 сентября v1.3.0 упал на странице (тело длиннее предела
# площадки), а повтор отвергла первая же проверка — «тег уже есть». Путь
# остался один — завести страницу руками, а с телефона его нет (126: выход
# не должен проходить через остановленное действие). Тег, поставленный выпуском
# (в журнале тега закрыт его раздел, в истории — его строка), без страницы
# теперь означает: дозавершить. Тег, коммит и журнал не трогаются, заводится только
# страница — из того, что выпуск уже записал.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия вида vX.Y.0 — только граница MINOR. Тег уже есть, а страницы нет — прогон дозавершит выпуск"
        required: true
        type: string
      # Не обязательно для формы, но обязательно для нового выпуска — это
      # проверяет первый шаг. Дозавершение берёт «Ключевое» из строки, которую
      # выпуск уже записал: второй ввод разошёлся бы с первым молча (035).
      summary:
        description: "Ключевое: что принёс выпуск, одной фразой без ссылок. При дозавершении не нужно"
        required: false
        type: string

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      notes: ${{ steps.notes.outputs.path }}
    env:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
    steps:
      # Секрета нет — отказ СРАЗУ и с адресом, а не через две минуты на толчке.
      # Штатный токен защиту ветки не проходит (см. ниже), значит без этого
      # секрета выпуск невозможен, и узнать это надо до того, как в дереве
      # появятся тег и закрытый раздел (правило 075).
      - name: токен владельца задан
        run: |
          if [ -z "${MERGE_QUEUE_TOKEN:-}" ]; then
            echo "::error::MERGE_QUEUE_TOKEN не задан — выпуск невозможен. Коммит выпуска уезжает в защищённую ветку, а штатный токен через её защиту не проходит. Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "токен владельца на месте"

      # Схема считает изменения по всей истории и по тегам: мелкий клон даст
      # неверное число молча.
      #
      # ВЫКАЧКА ИДЁТ ТОКЕНОМ ВЛАДЕЛЬЦА, И ЭТО ЗАМЕР. Прогоны 2 и 3 (3 сентября)
      # дошли до конца работы и упали на последней команде:
      #
      #   GH006: Protected branch update failed for refs/heads/main.
      #   - Required status check "catalogue" is expected.
      #
      # У НОВОГО КОММИТА ПРОВЕРКЕ ВЗЯТЬСЯ НЕГДЕ: защита требует зелёный
      # `catalogue` на толкаемой голове, а проверки идут ПОСЛЕ толчка. `[skip
      # ci]` этого не снимает, а делает вечным.
      #
      # ПОЧЕМУ ТОКЕН ЗАДАЁТСЯ ВЫКАЧКЕ, А НЕ ТОЛЧКУ. `actions/checkout`
      # прописывает `http.https://github.com/.extraheader`, и он идёт с КАЖДЫМ
      # запросом к github.com — включая толчок по адресу с другими учётными
      # данными. Замер 28 августа: толчок ушёл от имени бота при полностью
      # верном URL. Значит учётные данные меняют ТАМ, где заголовок ставится, и
      # тогда `git push origin` ниже не несёт секретов вовсе.
      #
      # ПОЧЕМУ НЕ ЧЕРЕЗ ИЗМЕНЕНИЕ, КАК ВСЁ ОСТАЛЬНОЕ У КАТАЛОГА. Разделить тег
      # и строку метрик нечем: `history_metrics --check` отвергает строку, у
      # которой нет тега — «поставлена вперёд него и обещает то, чего не
      # было», — а тег на коммите без закрытого раздела отвергают гейты
      # журнала. Проба это показала до толчка. Операция атомарна по существу, и
      # конвейер изменений её не выражает.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.MERGE_QUEUE_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # ТЕГ ЕСТЬ — ЭТО ЕЩЁ НЕ ОТКАЗ. Страница на месте — выпуск состоялся, и
      # номер не переиспользуется. Страницы нет — дозавершение, но только
      # если тег поставил сам выпуск: это решают следующие шаги по дереву
      # тега (раздел журнала, строка истории), а не имя тега. Страницу, которую
      # не удалось прочитать, за «нет страницы» не принимаем (075).
      - name: форма тега и инкремент MINOR
        id: form
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.version }}
          KEY: ${{ inputs.summary }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$WANT" | grep -qE '^v[0-9]+\.[0-9]+\.0$'; then
            echo "::error::«$WANT» не годится: схема требует vX.Y.0. PATCH-тегов не бывает — VERSIONING.md"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$WANT" >/dev/null; then
            if page=$(gh release view "$WANT" --json tagName 2>&1); then
              echo "::error::выпуск $WANT уже опубликован: тег и страница на месте. Номера не переиспользуются"
              exit 1
            fi
            if ! printf '%s' "$page" | grep -q 'release not found'; then
              echo "::error::страница выпуска $WANT не прочитана: $page"
              exit 1
            fi
            echo "finish=true" >> "$GITHUB_OUTPUT"
            echo "тег $WANT есть, страницы нет — дозавершаю: только страница"
            exit 0
          fi
          if [ -z "${KEY// /}" ]; then
            echo "::error::«Ключевое» пусто: у нового выпуска его вводит человек — машина не знает, что выпуск принёс"
            exit 1
          fi
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          if [ -n "$prev" ]; then
            echo "предыдущий релиз: $prev, следующий: $WANT"
          else
            echo "первый релиз по схеме: $WANT"
          fi

      # Тело релиза — раздел журнала. Забытая запись роняет выпуск, а не отдаёт
      # пустоту: это единственный момент, когда её ещё можно дописать.
      #
      # ДЛИННЫЙ РАЗДЕЛ ИДЁТ КРАТКО, А НЕ ОБРЕЗКОЙ. 27 сентября выпуск v1.3.0 упал
      # на последнем шаге: 229 записей весили 419 КБ, площадка принимает тело не
      # длиннее 125 000 знаков — HTTP 422, когда тег и коммит выпуска уже ушли.
      # Решает сборщик журнала, тем же разбором раздела, что и закрытие: здесь
      # стояла вторая копия этого разбора (214).
      #
      # ДОЗАВЕРШЕНИЕ ЧИТАЕТ ДЕРЕВО ТЕГА, А НЕ ГОЛОВУ. Раздел [X.Y.Z] и строку
      # истории выпуск записал в коммит, на котором стоит тег; голова могла
      # уйти дальше. Скрипты — с головы: в дереве тега этого режима ещё нет.
      # Раздела в теге нет — отказ сборщика: значит, тег поставил не выпуск.
      - name: раздел журнала под тег не пуст
        id: notes
        env:
          WANT: ${{ inputs.version }}
          KEY: ${{ inputs.summary }}
          FINISH: ${{ steps.form.outputs.finish }}
        run: |
          set -euo pipefail
          if [ "$FINISH" = true ]; then
            git worktree add -q --detach "$RUNNER_TEMP/at-tag" "$WANT"
            KEY=$(python scripts/history_metrics.py --root "$RUNNER_TEMP/at-tag" \
              --key-of "$WANT")
            python scripts/collect_changelog.py --notes "$WANT" --closed \
              --changelog "$RUNNER_TEMP/at-tag/CHANGELOG.md" --key "$KEY" \
              --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"
          else
            python scripts/collect_changelog.py --notes "$WANT" --key "$KEY" \
              --repo "$GITHUB_REPOSITORY" > "$RUNNER_TEMP/notes.md"
          fi
          echo "path=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          echo "тело релиза собрано, строк: $(wc -l < "$RUNNER_TEMP/notes.md")"

      # Предмет — дерево, на котором стоит или встанет тег. У нового выпуска
      # это голова: тег ставится на неё. У дозавершения голова могла уйти
      # дальше тега, и проверка головы сверяла бы не то, что получит
      # закрепившийся на теге потребитель.
      - name: публичная поверхность на месте
        env:
          FINISH: ${{ steps.form.outputs.finish }}
        run: |
          set -euo pipefail
          tree=.
          if [ "$FINISH" = true ]; then tree="$RUNNER_TEMP/at-tag"; fi
          missing=0
          for p in export/rules.json action.yml .github/actions/attribution/action.yml; do
            if [ ! -e "$tree/$p" ]; then echo "::error::нет $p"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "потребитель, закрепившийся на этом теге, получит всё, к чему его зовут"

      # Правило 035: версия задаётся в одном месте и подставляется везде.
      # Пример подключения в контракте — единственное место в прозе, где номер
      # виден потребителю, и переписывать его руками значит завести второй
      # источник истины.
      #
      # ЗДЕСЬ ЖЕ ЗАКРЫВАЕТСЯ РАЗДЕЛ ЖУРНАЛА И ДОПИСЫВАЕТСЯ СТРОКА ЭВОЛЮЦИИ
      # МЕТРИК. Обе операции держались договорённостью, и обе договорённости
      # сломались молча: после v0.1.0 два выпуска ушли без строки метрик, а
      # v1.1.0 — ещё и без своего раздела в журнале, оставив 42 записи в
      # [Unreleased], где их читают как ещё не вышедшие.
      #
      # ПОРЯДОК ВАЖЕН: журнал закрывается ПЕРЕД строкой метрик, чтобы числа
      # считались по тому же дереву, на которое встанет тег. Человек вводит
      # только «Ключевое», которого машина не знает.
      - name: раздел журнала, строка эволюции метрик и закреплённый пример
        if: steps.form.outputs.finish != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.version }}
          KEY: ${{ inputs.summary }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # ПОДПИСЬ СТАВИТСЯ ПЕРВОЙ СТРОКОЙ, И ЭТО ЗАМЕР. На первом же живом
          # запуске (прогон 33769248638, 3 сентября) шаг умер на строке ниже:
          #
          #   *** Please tell me who you are.
          #   fatal: empty ident name … not allowed
          #   ##[error]Process completed with exit code 128
          #
          # `git tag -a` — АННОТИРОВАННЫЙ тег, у него есть автор, и подписи он
          # требует так же, как коммит. Она задавалась ниже, внутри `else`, то
          # есть после первой же команде, которой была нужна. Прогон выпуска
          # никогда до этого не запускался — механизм был гипотезой (002), и
          # проверить его можно было только выпуском.
          #
          # ПОДПИСЬ БЕРЁТСЯ ИЗ СПИСКА АВТОРОВ, А НЕ ВПИСЫВАЕТСЯ ЗДЕСЬ. Коммит
          # выпуска уезжает в общую ветку, и автором в нём обязан стоять
          # человек из раздела «[авторы]» — иначе тот же гейт отверг бы
          # собственный коммит выпуска. Бот, стоявший здесь раньше, в списке не
          # объявлен: `--require-declared-author` сказал бы это на первом же
          # изменении после выпуска. Третья копия почты в дереве разошлась бы с
          # списком молча (049, 131).
          signature=$(python scripts/check_attribution.py --print-author)
          git config user.name  "${signature%% <*}"
          git config user.email "$(printf '%s' "$signature" | sed -n 's/.*<\(.*\)>.*/\1/p')"

          git tag -a "$WANT" -m "$WANT"
          python scripts/version.py --pin
          python scripts/collect_changelog.py --close "$WANT"
          python scripts/history_metrics.py --add "$WANT" --key "$KEY"
          if git diff --quiet; then
            echo "журнал, строка и пример уже на месте"
          else
            # ТРЕЙЛЕРЫ ОБЯЗАТЕЛЬНЫ, И ЭТО ЗАМЕР. Первый удавшийся выпуск завёл в
            # общей ветке коммит 861737c без единого трейлера, и
            # `attribution-history` покраснел на нём в тот же час: в режиме
            # первопредков гейт требует `Co-Authored-By` у КАЖДОГО коммита
            # итоговой истории, а не только у объединяющих.
            #
            # Поймано дежурным, а не мной: шаг был прогнан на копии до строки
            # «коммит сделан» и объявлен рабочим. Проверять надо было не то,
            # что коммит появился, а то, что он проходит собственные гейты
            # каталога (139).
            #
            # Подпись та же, что у `consumers-sync`: этот коммит делает
            # конвейер, и соавторство у пипелайновых коммитов уже объявлено там.
            {
              echo "chore(release): журнал, строка метрик и пример на $WANT [skip ci]"
              echo
              echo "Собрано прогоном: $RUN"
              echo
              echo "Co-Authored-By: Claude <noreply@anthropic.com>"
              echo "Claude-Session: $RUN"
            } > "$RUNNER_TEMP/release-msg.txt"
            git commit -q -a -F "$RUNNER_TEMP/release-msg.txt"
            git push origin HEAD:main
            # Тег переставляется на коммит с закрытым журналом, строкой и
            # закреплённым примером: иначе потребитель, закрепившийся на теге,
            # увидел бы в примере ПРЕДЫДУЩУЮ версию, а гейты не нашли бы ни
            # раздела, ни строки в дереве, по которому сами же их и сверяют.
            git tag -f -a "$WANT" -m "$WANT"
          fi

      # `--verify-tag`: страница встаёт только на тег, который уже есть в
      # общей ветке, — площадка не заведёт его сама на голове `main`.
      - name: тег и релиз
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.version }}
          FINISH: ${{ steps.form.outputs.finish }}
        run: |
          set -euo pipefail
          if [ "$FINISH" = true ]; then
            echo "тег $WANT уже в общей ветке — не толкаю и не переставляю"
          else
            git push origin "refs/tags/$WANT"
          fi
          gh release create "$WANT" --verify-tag --title "$WANT" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "выпущено: $WANT"
