# Изменение от агентского окна открывает ВЛАДЕЛЕЦ, а не приложение.
#
# ЭТО ИСПОЛНЕНИЕ 131, А НЕ НОВАЯ ИДЕЯ. Правило говорит прямо: операция, которая
# должна нести личность человека, из агентского окна не выполняется — прокси
# подменяет учётные данные на записи, и автором становится приложение; такая
# операция уходит В КОНВЕЙЕР. Эта работа и есть тот конвейер.
#
# ЦЕНА ТОГО, ЧТО ЕЁ НЕ БЫЛО. Шесть изменений окно открыло своим токеном, и все
# шесть уехали в общую ветку авторства приложения. Замер по ним же показал, чем
# это определяется: не подписью коммитов ветки — три изменения переподписали
# именем владельца, автор слияния не изменился, — а учётной записью, открывшей
# изменение (правило 131, задача #79). Переписать нечем: ветка защищена.
#
# ПРОБА ВМЕСТО ДОВЕРИЯ. 135 требует узнавать личность записью того же класса и
# смотреть на подпись результата. Первое же изменение, открытое этой работой, и
# есть такая проба: автор в общей ветке обязан стать человеком. Не стал —
# работа неверна, и это видно сразу, а не через шесть слияний.
#
# ИМЯ ВЕТКИ ЗДЕСЬ — ПЕРЕКЛЮЧАТЕЛЬ ПОВЕДЕНИЯ, и правило 003 требует сказать это
# первой строкой: ветка с префиксом `agent/` получает изменение автоматически,
# ветка с любым другим именем — НЕТ. Толкнули `fix/foo` — изменение придётся
# открывать руками, и автором станет тот, кто открыл.
#
# ТОКЕН ТОТ ЖЕ, ЧТО У АВТОМЕРЖА. MERGE_QUEUE_TOKEN — токен владельца.
# GITHUB_TOKEN не подходит по той же причине, по которой не подходит в
# automerge.yml: с ним автором становится бот (правила 131, 135).
name: agent-pr

on:
  push:
    branches:
      - "agent/**"
  # У события всегда есть ручная кнопка (правило 126). Здесь её не было, и
  # нашлось это не глазом: гейт разрешимости `where` потребовал назвать адрес
  # механизма, который держит 126, — а механизма не оказалось, зато нашлась
  # работа-исключение. Прогон читает `github.ref_name`, поэтому ручной запуск
  # с ветки `agent/**` делает ровно то же, что толчок в неё.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
    steps:
      # Секрета нет — предупреждение и выход, а не отказ: это ненастроенная
      # возможность, а не поломка изменения (правило 051). Уйти на GITHUB_TOKEN
      # молча нельзя — это дало бы ровно ту подмену авторства, ради которой
      # работа и заведена.
      - name: токен владельца не задан
        if: env.MERGE_QUEUE_TOKEN == ''
        run: |
          echo "::warning::MERGE_QUEUE_TOKEN не задан — изменение не открывается. Нужен токен владельца с правами contents:write и pull-requests:write."
          echo "SKIP=1" >> "$GITHUB_ENV"

      # Заголовок и тело берутся из коммитов ветки, значит нужна история.
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
        with:
          fetch-depth: 0

      # Изменение уже открыто — повторное создание не нужно и упало бы.
      # Пропуск, а не отказ: повторный толчок в ветку — штатное состояние.
      - name: изменение уже открыто
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          open=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "для $BRANCH изменение уже открыто — второй раз не завожу"
            # EXISTS, А НЕ SKIP. Прежде здесь стоял SKIP=1, и он глушил ВЕСЬ
            # прогон: на втором толчке в ту же ветку не проставлялась зона и не
            # считались пересечения. Зона при этом МЕНЯЕТСЯ от толчка к толчку —
            # слияние общей ветки затягивает в разницу чужие файлы, — и гейт
            # краснел на изменении, открытом верно (замер 2 сентября: три
            # изменения подряд, каждое после слияния main).
            echo "EXISTS=1" >> "$GITHUB_ENV"
          fi

      # Текст берётся из ПЕРВОГО коммита ветки: он описывает суть, а последний
      # обычно пересобирает производные. Через файл, а не строкой в оболочке —
      # между текстом и площадкой иначе встали бы две интерпретации (правило 013).
      - name: открыть изменение от имени владельца
        if: env.SKIP != '1' && env.EXISTS != '1'
        env:
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          first=$(git log --format=%H "origin/$BASE..HEAD" | tail -1)
          if [ -z "$first" ]; then
            echo "::warning::в $BRANCH нет коммитов сверх $BASE — открывать нечего"
            exit 0
          fi
          # СОДЕРЖИМОЕ, А НЕ КОММИТЫ. После squash-слияния коммиты ветки не
          # становятся предками общей: содержимое там же, а история другая, и
          # `origin/main..HEAD` остаётся непустым навсегда. Следующий толчок в
          # ту же ветку открывал ПУСТОЕ изменение — так появились #135 и #136,
          # и оба слились нулевыми коммитами. Сторож проверял не тот признак.
          if git diff --quiet "origin/$BASE...HEAD"; then
            echo "::warning::$BRANCH не отличается от $BASE содержимым — открывать нечего"
            exit 0
          fi
          git log -1 --format=%s "$first" > "$RUNNER_TEMP/title.txt"
          git log -1 --format=%b "$first" > "$RUNNER_TEMP/raw-body.md"
          # Задачу закрывает слово в ТЕЛЕ. Ссылка `(#83)` в заголовке — только
          # упоминание, и двенадцать слияний подряд не закрыли ничего (#120,
          # правило 064). Здесь упоминание превращается в связь.
          # Сборка предупреждает, но не отказывает: изменение без задачи всё
          # равно обязано открыться, иначе отмена останется без адресата
          # (правило 147). Отказ живёт в ci.yml, на самом изменении.
          python3 scripts/pr_body.py --build \
            --subject "$(cat "$RUNNER_TEMP/title.txt")" \
            --body-file "$RUNNER_TEMP/raw-body.md" > "$RUNNER_TEMP/body.md"
          gh pr create \
            --base "$BASE" --head "$BRANCH" \
            --title "$(cat "$RUNNER_TEMP/title.txt")" \
            --body-file "$RUNNER_TEMP/body.md"
          echo "изменение открыто владельцем: автор в общей ветке будет человеком"

      # ЗОНУ СТАВИТ МАШИНА, А НЕ ЧЕЛОВЕК. Инцидент правила 064 измерен на
      # нём же: «машина метила исправнее человека» — всё, что ставилось
      # автоматикой, стояло; всё, что зависело от дисциплины, отсутствовало у
      # двух третей. Замер 28 августа подтвердил на каталоге: у последних
      # десяти изменений метки не было ни у одного.
      #
      # ШАГ СТОИТ ОТДЕЛЬНО И ИДЁТ НА КАЖДЫЙ ТОЛЧОК, а не только при открытии.
      # Прежде он жил внутри «открыть изменение», и второй толчок в ту же
      # ветку зону не трогал. Зона при этом МЕНЯЕТСЯ: слияние общей ветки
      # затягивает в разницу чужие файлы, и гейт краснеет на изменении,
      # открытом верно. Замер 2 сентября: три изменения подряд, каждое после
      # слияния main, и каждое пришлось метить руками.
      #
      # `--add-label` идемпотентен: уже стоящая метка не ставится дважды.
      # Лишнюю метку шаг НЕ снимает — зона, поставленная человеком, это его
      # решение, а не шум (правило 051).
      #
      # Отказ здесь НЕ роняет прогон: изменение без метки лучше, чем
      # неоткрытое изменение (правило 147 — отмена без адресата). Гейт в
      # `ci.yml` всё равно скажет, а сказать он может только о том, что
      # открыто.
      - name: зона изменения проставлена
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          git diff --name-only "origin/$BASE...HEAD" > "$RUNNER_TEMP/paths.txt"
          zones=$(python3 scripts/check_labels.py \
                    --paths-from "$RUNNER_TEMP/paths.txt" | paste -sd, -) || zones=""
          if [ -n "$zones" ]; then
            gh pr edit "$BRANCH" --add-label "$zones" \
              && echo "зона проставлена: $zones" \
              || echo "::warning::зону $zones проставить не вышло — гейт скажет об этом на изменении"
          else
            echo "тронутых зон нет — метка не нужна"
          fi

      # ПЕРЕСЕЧЕНИЕ ФАЙЛОВ — ГРАНИЦА ИЗМЕНЕНИЯ (правило 133). Шаг НЕ блокирует:
      # пересечение бывает законным — производные трогает почти каждая правка.
      # Он даёт отмене адресата: список пишется в сводку работы, где его видит
      # тот, кто толкнул (147). Замер 2 сентября: ветка с механизмом для 021 и
      # ночной `consumers-sync` тронули export/where.* одновременно, и узналось
      # это конфликтом после толчка, а не до.
      - name: кто ещё правит те же файлы
        if: env.SKIP != '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ env.MERGE_QUEUE_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          out=$(python3 scripts/check_overlap.py --branch "$BRANCH" 2>&1); code=$?
          printf '%s\n' "$out"
          {
            echo "### Пересечение файлов"
            echo
            printf '%s\n' "$out" | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$code" -le 1 ] || echo "::warning::проверка пересечения не отработала — см. вывод выше"
