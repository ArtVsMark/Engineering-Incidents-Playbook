# Единый значок «Python │ ОС │ coverage │ release / PyPI │ version» у потребителя.
#
# Скрипт исполняется из каталога на теге из строки uses: (GITHUB_ACTION_PATH),
# а не копией в проекте: копия разошлась бы с каталогом при первой правке
# (095). Прогоны спрашиваются у площадки ПРОЕКТА — того репозитория, в
# рабочем дереве которого действие запущено.
#
# Действие только РИСУЕТ картинку в `out`. Куда её публиковать — ветка
# значков, Pages, артефакт — решает проект: у семьи это устроено по-разному.
# Код выхода 2 — площадка не ответила или подписывать нечего; серым это не
# рисуется, и прежний значок публикацией лучше не трогать.
name: Значок Python каталога
description: >-
  Рисует единый значок «Python │ версии │ ОС │ coverage │ release / PyPI │
  version»: проверки — исходами прогонов на main, покрытие и версия — из
  файлов значков проекта, выпуск — сверкой с PyPI; серый — не проверялось.

inputs:
  ci-workflow:
    description: >-
      Файл основного CI в .github/workflows — его исход красит «Python», а
      его работы — части ОС.
    required: false
    default: ci.yml
  out:
    description: Куда положить SVG, относительно корня проекта.
    required: false
    default: .github/badges/python.svg
  coverage-json:
    description: >-
      Файл значка покрытия проекта (shields endpoint) — из него берётся
      message. Пусто — зона покрытия серая «—».
    required: false
    default: ""
  version-json:
    description: >-
      Файл значка версии проекта (shields endpoint). Пусто — зона версии серая.
    required: false
    default: ""
  pypi:
    description: >-
      Имя пакета на PyPI. Пусто — проект на PyPI не публикуется, и зона
      «release / PyPI» серая. Иначе зелёная — номер на PyPI совпадает с
      последним выпуском, красная — расходится.
    required: false
    default: ""
  token:
    description: Токен для чтения прогонов (нужно право actions read).
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: нарисовать значок Python
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CI_WORKFLOW: ${{ inputs.ci-workflow }}
        OUT: ${{ inputs.out }}
        COVERAGE_JSON: ${{ inputs.coverage-json }}
        VERSION_JSON: ${{ inputs.version-json }}
        PYPI: ${{ inputs.pypi }}
      run: |
        set -euo pipefail
        args=(--root "$GITHUB_WORKSPACE" --ci "$CI_WORKFLOW" --out "$GITHUB_WORKSPACE/$OUT")
        [ -n "$COVERAGE_JSON" ] && args+=(--coverage-json "$GITHUB_WORKSPACE/$COVERAGE_JSON")
        [ -n "$VERSION_JSON" ] && args+=(--version-json "$GITHUB_WORKSPACE/$VERSION_JSON")
        [ -n "$PYPI" ] && args+=(--pypi "$PYPI")
        python "$GITHUB_ACTION_PATH/../../../scripts/python_badge.py" "${args[@]}"
