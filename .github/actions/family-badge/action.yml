# ПЕРЕХОДНИК, А НЕ РЕАЛИЗАЦИЯ (этап 3 #930, решение владельца 29.10). Значки
# и факты держат механизмы; рисует их действие механизмов с тем же именем и
# теми же входами. Здесь — только передача входов, чтобы проект, поднявший тег
# каталога, не сломался до своего перехода. Второго рисовальщика нет (214):
# своего кода у переходника нет. Переходите на `step-facts` механизмов —
# переходник снимется, когда на него не останется вызовов.
name: family-badge
description: >-
  Сверяет, что проект отдаёт и что берёт у семьи, со свежими версиями из сводки
  семьи и рисует значок по сегментам gives · family · pairs · ext и блок
  издателей EIP · EPM; серый — не сверялось.
  Переходник: передаёт входы действию механизмов с тем же именем.
inputs:
  out:
    description: Куда положить SVG, относительно корня проекта; разбор family-check.json — рядом.
    default: .github/badges/family.svg
  family:
    description: Адрес или путь сводки семьи; пусто — сводка, которую публикует каталог.
    default: ""
runs:
  using: composite
  steps:
    - uses: ArtVsMark/Engineering-Pipeline-Mechanisms/.github/actions/family-badge@v1.11.0
      with:
        out: ${{ inputs.out }}
        family: ${{ inputs.family }}
