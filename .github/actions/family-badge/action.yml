# Семейный значок «family │ gives │ family │ pairs │ ext │ EIP · EPM» у потребителя.
#
# Скрипт исполняется из каталога на теге из строки uses: (GITHUB_ACTION_PATH),
# а не копией в проекте: копия разошлась бы с каталогом при первой правке
# (095). Сверяется дерево ПРОЕКТА — того репозитория, в рабочем дереве
# которого действие запущено, — с опубликованной сводкой семьи.
#
# Действие только РИСУЕТ картинку и кладёт рядом разбор `family-check.json`.
# Куда их публиковать, решает проект, как и у `python-badge`. Цвет значка —
# данные, а не исход шага: красный значок рисуется, а не роняет прогон (004).
# Код выхода 2 — сводка семьи не прочитана; шаг краснеет, а прежний значок
# публикацией лучше не трогать.
name: Семейный значок каталога
description: >-
  Сверяет, что проект отдаёт и что берёт у семьи, со свежими версиями из
  сводки семьи и рисует значок по сегментам gives · family · pairs · ext и
  блок издателей EIP · EPM; серый — не сверялось.

inputs:
  out:
    description: >-
      Куда положить SVG, относительно корня проекта. Разбор
      `family-check.json` ложится в ту же папку.
    required: false
    default: .github/badges/family.svg
  family:
    description: >-
      Адрес или путь сводки семьи. По умолчанию — сводка, которую публикует
      каталог на ветке значков.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: нарисовать семейный значок
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        FAMILY: ${{ inputs.family }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        # Имя проекта — от площадки, а не умолчание скрипта: умолчание —
        # каталог, и сосед сверялся бы как издатель EIP.
        args=(--root "$GITHUB_WORKSPACE" --repo "$REPO" --out "$GITHUB_WORKSPACE/$OUT")
        [ -n "$FAMILY" ] && args+=(--family "$FAMILY")
        python "$GITHUB_ACTION_PATH/../../../scripts/family_check.py" "${args[@]}"
