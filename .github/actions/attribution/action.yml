# Гейт атрибуции, который каталог отдаёт потребителям.
#
# Логика живёт в одном месте и подключается ссылкой на версию, а не копируется
# в третий репозиторий (правила 090 и 022). Копия разъедется с первой же
# правкой, и разойдутся при этом гейты — то есть то, чем всё держится.
#
# Что принадлежит ПРОЕКТУ, а не инструменту, и потому вынесено в параметры:
# список согласованных имён и коммит, с которого атрибуция обязательна. У
# каждого потребителя они свои, и подстановка чужих даёт красное на верных
# коммитах — гейт хуже отсутствующего (правило 051, задача #54).
name: Гейт атрибуции
description: >-
  Сверяет трейлеры соавторства со списком согласованных имён проекта. Умеет два
  предмета: коммиты ветки до слияния и первопредки общей ветки после.

inputs:
  authors:
    description: "Путь к списку согласованных имён внутри репозитория проекта"
    required: false
    default: .github/authors.txt
  baseline:
    description: >-
      Начало отсчёта для mode=branch. Подрезает ДИАПАЗОН ВЕТКИ: коммиты ветки
      старше него не спрашиваются. Пусто — подрезки нет.
      НЕ ПУТАТЬ С since: оба «начало отсчёта», но baseline работает в режиме
      ветки, а since — в режиме первопредков, и в чужом режиме каждый из них
      не делает НИЧЕГО. Требовать задним числом от истории, которую не
      переписать, значит требовать невозможного (правило 114).
    required: false
    default: ""
  since:
    description: >-
      Объявленное начало для mode=first-parents: первопредки старше него не
      спрашиваются. Пусто — спрашивается вся история, и долг виден числом.
      Без этого входа режим первопредков был вечно красным у любого
      потребителя с историей до подключения: скрипт предлагает --since в
      собственном сообщении об отказе, а через действие до него было не
      дотянуться (задача #80). Гейт, который краснеет неотвратимо, перестают
      читать (правило 051) — то есть подключённый механизм оказывался хуже
      отсутствующего.
    required: false
    default: ""
  require-declared-author:
    description: >-
      true — автором каждого коммита обязан стоять человек из раздела
      «[авторы]» списка. Ключ отдельный и по умолчанию выключен: у проекта
      такого раздела может не быть, и тогда требовать его нечем — это был бы
      отказ на пустом месте. Проверка автора БЕЗ него остаётся запретительной
      и ловит одно написание; чем это стоило, записано в задаче #79.
    required: false
    default: "false"
  require-coauthor:
    description: >-
      true — считать отказом коммит вовсе без атрибуции. По умолчанию такие
      только считаются и печатаются числом: требование трейлеров это
      договорённость про АГЕНТСКИЕ коммиты, и «без атрибуции N» честным числом
      — решение по правилу 041. Проекту, у которого весь поток идёт через
      облачные окна, нужен отказ; это свойство проекта, а не инструмента.
    required: false
    default: "false"
  mode:
    description: "branch — коммиты ветки; first-parents — первопредки общей ветки"
    required: false
    default: branch
  range:
    description: "Диапазон для mode=branch, например base..head. Пусто — origin/main..HEAD"
    required: false
    default: ""
  ref:
    description: "Общая ветка для mode=first-parents"
    required: false
    default: origin/main
  catalogue:
    description: "Репозиторий каталога, откуда берётся сам гейт"
    required: false
    default: ArtVsMark/Engineering-Incidents-Playbook
  catalogue-ref:
    description: >-
      Версия каталога. Закрепите тегом: подключаться к движущейся ветке значит
      получить чужую правку гейта в свой красный прогон.
    required: false
    default: main

runs:
  using: composite
  steps:
    # Каталог кладётся рядом, а не поверх: рабочий каталог проекта — это и есть
    # то, чью историю проверяют.
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.catalogue }}
        ref: ${{ inputs.catalogue-ref }}
        path: .attribution-gate
        fetch-depth: 1

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: сверить атрибуцию
      shell: bash
      run: |
        set -euo pipefail
        args=(--repo "$GITHUB_WORKSPACE" --authors "${{ inputs.authors }}")
        args+=(--baseline "${{ inputs.baseline }}")
        if [ "${{ inputs.require-declared-author }}" = "true" ]; then
          args+=(--require-declared-author)
        fi
        if [ "${{ inputs.require-coauthor }}" = "true" ]; then
          args+=(--require-coauthor)
        fi
        if [ "${{ inputs.mode }}" = "first-parents" ]; then
          args+=(--first-parents --ref "${{ inputs.ref }}")
          if [ -n "${{ inputs.since }}" ]; then
            args+=(--since "${{ inputs.since }}")
          fi
        elif [ -n "${{ inputs.range }}" ]; then
          args+=(--range "${{ inputs.range }}")
        fi
        python .attribution-gate/scripts/check_attribution.py "${args[@]}"
