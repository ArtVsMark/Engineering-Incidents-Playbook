# Значок проекта в две строки (#844): сверху «CI │ Python │ ОС │ coverage │
# release / PyPI │ version», снизу «rules │ machine │ own │ taken» и
# «family │ … │ EIP · EPM».
#
# Скрипты исполняются из каталога на теге из строки uses: (GITHUB_ACTION_PATH),
# а не копией в проекте: копия разошлась бы с каталогом при первой правке
# (095). Считается дерево ПРОЕКТА: его прогоны, его ответ каталогу, его
# манифест; извне приходит только сводка семьи — эталон для сверки.
#
# Действие рисует три картинки рядом: python.svg, family.svg с разбором
# family-check.json, python.zones.json и project.svg — две строки: `rules`
# кончается под `mac`, правее свободно. Куда их публиковать,
# решает проект, как и у python-badge и family-badge. Цвет — данные, а не исход
# шага: красный значок рисуется, а не роняет прогон (004). Код выхода 2 —
# значок не собран: площадка не ответила о прогонах или сводка семьи не
# прочитана; прежний значок публикацией лучше не трогать.
name: Значок проекта каталога
description: >-
  Рисует значок проекта в две строки: проверки, Python, ОС, покрытие, выпуск и
  версия сверху; правила машиной, механизмы и сверка с семьёй снизу. Серое —
  не прочитано, с причиной в подсказке.

inputs:
  out-dir:
    description: >-
      Папка для картинок относительно корня проекта: python.svg, family.svg,
      family-check.json и project.svg.
    required: false
    default: .github/badges
  ci-workflow:
    description: Файл основного CI в .github/workflows — как у python-badge.
    required: false
    default: ci.yml
  coverage-json:
    description: Файл значка покрытия (shields endpoint); пусто — зона серая.
    required: false
    default: ""
  coverage-all-json:
    description: Покрытие, сведённое по всем ОС; задан — второе число в зоне.
    required: false
    default: ""
  version-json:
    description: Файл значка версии (shields endpoint); пусто — зона серая.
    required: false
    default: ""
  suites:
    description: Наборы проверок основного CI — как у python-badge.
    required: false
    default: ""
  pypi:
    description: Имя пакета на PyPI; пусто — зона «release / PyPI» серая.
    required: false
    default: ""
  family:
    description: Адрес или путь сводки семьи; пусто — сводка каталога.
    required: false
    default: ""
  token:
    description: Токен для чтения прогонов (нужно право actions read).
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: нарисовать значок проекта
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        OUT_DIR: ${{ inputs.out-dir }}
        CI_WORKFLOW: ${{ inputs.ci-workflow }}
        COVERAGE_JSON: ${{ inputs.coverage-json }}
        COVERAGE_ALL_JSON: ${{ inputs.coverage-all-json }}
        VERSION_JSON: ${{ inputs.version-json }}
        PYPI: ${{ inputs.pypi }}
        SUITES: ${{ inputs.suites }}
        FAMILY: ${{ inputs.family }}
        REPO: ${{ github.repository }}
      run: |
        set -uo pipefail
        dir="$GITHUB_WORKSPACE/$OUT_DIR"
        mkdir -p "$dir"
        # Строка 1 — тот же расчёт, что у python-badge.
        args=(--root "$GITHUB_WORKSPACE" --ci "$CI_WORKFLOW" --out "$dir/python.svg")
        [ -n "$COVERAGE_JSON" ] && args+=(--coverage-json "$GITHUB_WORKSPACE/$COVERAGE_JSON")
        [ -n "$COVERAGE_ALL_JSON" ] && args+=(--coverage-all-json "$GITHUB_WORKSPACE/$COVERAGE_ALL_JSON")
        [ -n "$VERSION_JSON" ] && args+=(--version-json "$GITHUB_WORKSPACE/$VERSION_JSON")
        [ -n "$PYPI" ] && args+=(--pypi "$PYPI")
        [ -n "$SUITES" ] && args+=(--suites "$SUITES")
        python_rc=0
        python "$GITHUB_ACTION_PATH/../../../scripts/python_badge.py" "${args[@]}" || python_rc=$?
        # Зоны семьи — тот же расчёт, что у family-badge; имя проекта — от
        # площадки, а не умолчание скрипта: умолчание — каталог.
        fargs=(--root "$GITHUB_WORKSPACE" --repo "$REPO" --out "$dir/family.svg")
        [ -n "$FAMILY" ] && fargs+=(--family "$FAMILY")
        family_rc=0
        python "$GITHUB_ACTION_PATH/../../../scripts/family_check.py" "${fargs[@]}" || family_rc=$?
        # Склейка — даже при отказе одной из частей: на её месте серое с причиной.
        project_rc=0
        python "$GITHUB_ACTION_PATH/../../../scripts/project_badge.py" --root "$GITHUB_WORKSPACE" \
          --python-zones "$dir/python.zones.json" --family-json "$dir/family-check.json" \
          --out "$dir/project.svg" || project_rc=$?
        if [ "$python_rc" -eq 2 ] || [ "$family_rc" -eq 2 ] || [ "$project_rc" -eq 2 ]; then
          echo "::error::значок проекта не собран целиком: python $python_rc, family $family_rc, project $project_rc"
          exit 2
        fi
        [ "$project_rc" -eq 1 ] && echo "::warning::значок проекта собран с серыми частями — причины выше"
        exit 0
