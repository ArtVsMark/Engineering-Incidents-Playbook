# Метки этого репозитория. Правило 064: метка — вход механизма, а не украшение.
#
# Это НЕ копия templates/labels.yml. Заготовка отдаётся другим проектам, а наша
# же инструкция к ней требует: «выкиньте то, чего у вас нет — правило, которое
# не применяется, обесценивает соседние». Ниже — что выкинуто и почему.
#
# Применить:  gh label create "$name" --color "$color" --description "$desc"
#             (или любым синхронизатором меток)

# --- содержание: ставит автор ------------------------------------------------
# Зоны — по артефактам каталога, а не по слоям приложения: у каталога нет ядра,
# интерфейса и веба, зато есть записи, гейты, заготовки, контракт и витрины.
- name: "area/rules"
  color: "1d76db"
  description: "Зона: записи каталога, оба дерева"
- name: "area/gates"
  color: "1d76db"
  description: "Зона: скрипты проверок и конвейер"
- name: "area/templates"
  color: "1d76db"
  description: "Зона: заготовки, которые берут другие проекты"
- name: "area/export"
  color: "1d76db"
  description: "Зона: экспорт и контракт потребления"
- name: "area/showcase"
  color: "1d76db"
  description: "Зона: витрины, START, TOP-10, история, журнал"

- name: "bug"
  color: "d73a4a"
  description: "Дефект: поведение расходится с обещанным"
- name: "enhancement"
  color: "0e8a16"
  description: "Новое поведение"
- name: "tech-debt"
  color: "fbca04"
  description: "Долг: работает, но мешает менять"
- name: "security"
  color: "b60205"
  description: "Безопасность: недоверенный вход, права, изоляция"

# Правило 065: путь новичка первым вкладом не кончается, поэтому меток две.
- name: "good first issue"
  color: "7057ff"
  description: "Первый вклад: изолированно, низкий барьер, тело на двух языках"
- name: "help wanted"
  color: "008672"
  description: "Второй шаг новичка: тело на двух языках"

# --- чего здесь нет намеренно -------------------------------------------------
#
# documentation — в каталоге документация это всё. Метка, которая подходит
#   каждой задаче, не разделяет ничего и мешает читать соседние.
#
# difficulty/* — сложность ставят для внешнего участника, чтобы он выбрал по
#   силам. Внешних участников пока нет; появятся — метки вернутся.
#
# merge-when-green · hold · blocker · needs-rebase — метки КОНВЕЙЕРА, и их
#   ставит автоматика. Автоматики слияния здесь нет: мержит владелец руками.
#   Метка, которую не читает ни одна машина, — украшение, а правило 064 ровно
#   про это. Появится очередь мержа — вернутся вместе с ней, и не раньше.
