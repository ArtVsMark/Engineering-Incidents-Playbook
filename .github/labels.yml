# Метки этого репозитория. Правило 064: метка — вход механизма, а не украшение.
#
# Это НЕ копия templates/labels.yml. Заготовка отдаётся другим проектам, а наша
# же инструкция к ней требует: «выкиньте то, чего у вас нет — правило, которое
# не применяется, обесценивает соседние». Ниже — что выкинуто и почему.
#
# Применяется автоматически: .github/workflows/labels-sync.yml на правку этого
# файла и по кнопке. Руками — python scripts/sync_labels.py --dry-run посмотреть,
# без ключа применить. Метка, которой здесь нет, НЕ удаляется: удаление снимает
# её со всех задач разом, и это решение человека, а не побочный эффект.

# --- содержание: ставит автор ------------------------------------------------
# Зоны — по артефактам каталога, а не по слоям приложения: у каталога нет ядра,
# интерфейса и веба, зато есть записи, гейты, заготовки, контракт и витрины.
- name: "area/rules"
  color: "1d76db"
  description: "Зона: записи каталога, оба дерева"
- name: "area/gates"
  color: "1d76db"
  description: "Зона: скрипты проверок и конвейер"
- name: "area/templates"
  color: "1d76db"
  description: "Зона: заготовки, которые берут другие проекты"
- name: "area/export"
  color: "1d76db"
  description: "Зона: экспорт и контракт потребления"
- name: "area/showcase"
  color: "1d76db"
  description: "Зона: витрины, START, TOP-10, история, журнал"

# `documentation` живёт здесь не как зона, а как разметка, которая УЖЕ СТОИТ на
# живых задачах. Снять её значило бы потерять разметку ради чистоты файла;
# признать зоной — завести вторую классификацию поверх зон по артефактам
# (правило 022). Поэтому объявлена ровно тем, чем является: пометкой про текст.
- name: "documentation"
  color: "0075ca"
  description: "Текст, а не механизм: витрина, свод, перевод"

# `duplicate` — единственное умолчание площадки, которое ЧИТАЕТ МАШИНА:
# закрытие задачи со state_reason `duplicate` вешает её само. Метка, которую
# читает механизм, — не украшение, и это ровно критерий 064. Остальные
# умолчания (invalid, question, wontfix) машина не читает и здесь не объявлены.
- name: "duplicate"
  color: "cfd3d7"
  description: "Повтор: закрыто со ссылкой на первое (ставит площадка)"

- name: "bug"
  color: "d73a4a"
  description: "Дефект: поведение расходится с обещанным"
- name: "enhancement"
  color: "0e8a16"
  description: "Новое поведение"
- name: "tech-debt"
  color: "fbca04"
  description: "Долг: работает, но мешает менять"
- name: "security"
  color: "b60205"
  description: "Безопасность: недоверенный вход, права, изоляция"

# Правило 065: путь новичка первым вкладом не кончается, поэтому меток две.
- name: "good first issue"
  color: "7057ff"
  description: "Первый вклад: изолированно, низкий барьер, тело на двух языках"
- name: "help wanted"
  color: "008672"
  description: "Второй шаг новичка: тело на двух языках"

# --- чего здесь нет намеренно -------------------------------------------------
#
# documentation — было выкинуто как метка, подходящая каждой задаче. Вернулась
#   по замеру (#106): она СТОЯЛА на живых задачах, и снятие потеряло бы
#   разметку. Объявлена узко — «текст, а не механизм», — и зоной не считается.
#
# invalid · question · wontfix · accessibility — умолчания площадки и мусор,
#   которых не читает ни один механизм. В этом репозитории не встречались или
#   встретились по ошибке. Удаление — решение человека: оно снимает метку со
#   всех задач разом, и скрипт этого не делает намеренно (#106, правило 051).
#
# difficulty/* — сложность ставят для внешнего участника, чтобы он выбрал по
#   силам. Внешних участников пока нет; появятся — метки вернутся.
#
# merge-when-green · hold · blocker · needs-rebase — метки КОНВЕЙЕРА, и их
#   ставит автоматика. Слияние теперь автоматическое (automerge.yml), но меток
#   оно не читает: включает автомерж по состоянию проверок, а не по метке.
#   Метка, которую не читает ни одна машина, — украшение, а правило 064 ровно
#   про это. Появится очередь мержа — вернутся вместе с ней, и не раньше.
