# Заявка потребителя. Форма, а не свободный текст: адрес ответа разбирается
# машинно и превращается в запись реестра, а прозу пришлось бы переписывать
# руками — то есть шагом, который надо помнить (правило 002).
#
# ПОЧЕМУ ЗАЯВКА, А НЕ ОБХОД. Каталог наружу не пишет и не рассылает: тянет
# потребитель, своим токеном и в свой трекер (129). Значит и сказать о себе
# может только он сам — иного канала у внешнего проекта нет вовсе.
name: Объявляюсь потребителем каталога
description: Проект держится правил каталога и хочет, чтобы каталог о нём знал
title: "Потребитель: <владелец/репозиторий>"
labels: ["area/export"]
body:
  - type: markdown
    attributes:
      value: |
        Каталог не ищет потребителей сам и не пишет в чужие репозитории. Пока
        вы не объявитесь, ваш ответ по правилам никто не прочитает: адреса
        неоткуда взять.

        Правила при этом можно брать и без заявки — они публичны, а прогон
        `rules-inbox` ведёт вашу задачу-«входящие» у вас. Заявка нужна для
        обратной стороны: чтобы ваш ответ попал в общую сводку «где действует»,
        а ваши предложения правил дошли до каталога.

  - type: input
    id: repo
    attributes:
      label: Репозиторий
      description: "Владелец и имя, как на площадке: например `owner/project`"
      placeholder: owner/project
    validations:
      required: true

  - type: input
    id: bindings
    attributes:
      label: Адрес ответа по правилам
      description: >
        Прямая ссылка на ваш `.rules/bindings.json` — обычный HTTPS, без API и
        без клона. Файл собирается `scripts/onboard_consumer.py` каталога.
      placeholder: https://raw.githubusercontent.com/owner/project/main/.rules/bindings.json
    validations:
      required: true

  - type: input
    id: proposals
    attributes:
      label: Адрес предложений
      description: >
        Ссылка на `.rules/proposals.json` — канал обратно: правило, родившееся
        у вас, приезжает в каталог этим файлом. Пусто — канал не подключён, и
        это состояние, а не отказ.
      placeholder: https://raw.githubusercontent.com/owner/project/main/.rules/proposals.json

  - type: dropdown
    id: access
    attributes:
      label: Доступ к репозиторию
      description: >
        У приватного проекта ответ не читается, и это НЕ то же самое, что
        «не подключён»: первое — неизвестно, второе — известно и пусто.
      options:
        - публичный
        - приватный
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Что стоит знать
      description: >
        Необязательно. Например: какие области правил у вас заведомо без
        предмета, или с какого числа вы держитесь каталога.
