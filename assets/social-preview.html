<!doctype html><html lang="ru"><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:640px}
  body{
    background:#0d1117;color:#e6edf3;
    font-family:"DejaVu Sans","Noto Sans","Liberation Sans",sans-serif;
    display:grid;grid-template-rows:8px 1fr;
  }
  /* Полоса прогонов: почти всё зелёное, два красных. Мотив каталога —
     запись рождается из поломки, а не из мнения. */
  .runs{display:flex}
  .runs i{flex:1}
  main{padding:0 78px;display:flex;flex-direction:column;justify-content:center;gap:34px}
  .repo{
    font-family:"DejaVu Sans Mono","Liberation Mono",monospace;
    font-size:23px;color:#7d8590;
  }
  h1{font-size:78px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
  .rule{color:#3fb950}
  .ru{font-size:34px;line-height:1.3;font-weight:600;max-width:1030px}
  .en{font-size:27px;line-height:1.3;color:#8b949e;max-width:1030px}
</style></head><body>
  <div class="runs" id="runs"></div>
  <main>
    <div class="repo">github.com/ArtVsMark/claude-code-playbook</div>
    <h1>Engineering<br>Incidents <span class="rule">Playbook</span></h1>
    <div>
      <p class="ru">Правила для Claude Code и GitHub.<br>Каждое выросло из реальной поломки.</p>
      <p class="en" style="margin-top:12px">Incident-based rules: what broke, how it surfaced, what it cost.</p>
    </div>
  </main>
<script>
  const red = new Set([9, 31]);
  const bar = document.getElementById('runs');
  for (let i = 0; i < 48; i++) {
    const s = document.createElement('i');
    s.style.background = red.has(i) ? '#f85149' : '#238636';
    bar.appendChild(s);
  }
</script>
</body></html>
