# Метки. Реализует правило 064: метка — вход механизма, а не украшение.
#
# Ключевое деление, которое надо сохранить при любой правке:
#   • МЕТКИ СОДЕРЖАНИЯ ставит автор — зона, тип работы. От них зависит
#     маршрутизация и отчёт.
#   • МЕТКИ КОНВЕЙЕРА ставит автоматика — очередь, стоп, обновление.
#     Требовать их от человека значит ломать механизм руками.
# Смешаете — и люди начнут дублировать автоматику вручную.
#
# Применить:  gh label create "$name" --color "$color" --description "$desc"
# или любым из готовых синхронизаторов меток.

# --- содержание: ставит автор ------------------------------------------------
- name: "area/core"
  color: "1d76db"
  description: "Зона: ядро"
- name: "area/cli"
  color: "1d76db"
  description: "Зона: интерфейс командной строки"
- name: "area/web"
  color: "1d76db"
  description: "Зона: веб"
- name: "area/docs"
  color: "1d76db"
  description: "Зона: документация"
- name: "area/ci"
  color: "1d76db"
  description: "Зона: конвейер и сборка"

- name: "bug"
  color: "d73a4a"
  description: "Дефект: поведение расходится с обещанным"
- name: "enhancement"
  color: "0e8a16"
  description: "Новое поведение"
- name: "tech-debt"
  color: "fbca04"
  description: "Долг: работает, но мешает менять"
- name: "security"
  color: "b60205"
  description: "Безопасность и приватность"
- name: "documentation"
  color: "0075ca"
  description: "Только документация"

- name: "difficulty/easy"
  color: "c2e0c6"
  description: "Локальное изменение, минимум контекста"
- name: "difficulty/medium"
  color: "fef2c0"
  description: "Несколько модулей или неочевидная логика"
- name: "difficulty/hard"
  color: "f9d0c4"
  description: "Архитектура, кросс-модульные инварианты"

# Правило 065: на эти две метки приводит англоязычная витрина, поэтому тело
# задачи ведётся на двух языках — и меток именно две, потому что путь новичка
# первым вкладом не кончается.
- name: "good first issue"
  color: "7057ff"
  description: "Первый вклад: изолированно, низкий барьер, тело на двух языках"
- name: "help wanted"
  color: "008672"
  description: "Второй шаг новичка: тело на двух языках"

# --- конвейер: ставит автоматика --------------------------------------------
# Правило 053: приоритет, живущий только в разговоре, для механизма не
# существует. Очередь читает признаки, а не намерения.
- name: "merge-when-green"
  color: "5319e7"
  description: "Конвейер: слить, как только проверки пройдут"
- name: "hold"
  color: "e99695"
  description: "Конвейер: СТОП — сливает владелец руками, сильнее любого приоритета"
- name: "blocker"
  color: "b60205"
  description: "Конвейер: вперёд очереди"
- name: "needs-rebase"
  color: "fbca04"
  description: "Конвейер: ветка отстала от основной"
